MACHINE_NAME="DW-AMD-LINUX"
NOTES="Single RTX 5080 (16GB), 62GB RAM. llama.cpp only — vLLM is not installed here. The built-in registry describes the dual-3090 box, so ENABLE_BUILTIN_MODELS=0 and models are defined in models.d/. No agents run on this box, hence HERMES/OPENCLAW disabled. llama.cpp REBUILT 2026-09-16 from b9775 (2026-06-23) to b11011 (commit aa39d7a3e): Release + CUDA arch 120 + GGML_NATIVE + OpenMP, nvcc 13.2.78, gcc 13.3, at /home/david/llama.cpp/build-b11011 — LLAMA_SERVER points at that versioned directory; the retired tree is build-b9775-cuda13.2. RENAME TRAP: build-tree binaries carry an absolute RUNPATH into their own bin/, so a build directory renamed after linking cannot find libllama-server-impl.so (status 127, then systemd rate-limits the unit: 'systemctl --user reset-failed llm-<name>' before the next 'llmctl up'). Point LLAMA_SERVER at a versioned build dir instead of renaming. test-backend-ops -b CUDA0 on b11011: 16055/16111, every one of the 56 failures is MUL_MAT/MUL_MAT_ID on iq1_s, iq2_s or iq3_s, and the old b9775 build fails the identical 33 MUL_MAT cases — upstream ggml-org/llama.cpp#28581: nvcc 13.2 miscompiles those three kernels on sm_120 (garbage output, not a slowdown); rebuilding with CUDA 13.3 fixes it (cuda-toolkit-13-3 13.3.1-1 is in apt, not installed). No registered model uses those quants, but IQ1_S / IQ2_S / IQ3_S GGUFs must not be served here until a CUDA 13.3 rebuild; IQ1_M, IQ2_XS/XXS, IQ3_XXS, IQ4_NL/XS and all K-quants pass. qwen9b on b11011: load 2 s, prefill 5449 tok/s, gen 127.6 tok/s (b9775: 133, one bench each, within noise). For the vision audition unsloth/Qwen3.5-{0.8B,4B,9B}-GGUF each ship mmproj-F16.gguf. EVAL TOOLCHAIN (2026-09-16, no passwordless sudo here so everything is user-local): Icarus Verilog 12.0 and Verilator 5.020 built from source into ~/.local (autoconf 2.72 built there first; verilator's man pages need help2man, absent, so its .1 files were touched before 'make install'); nvcc is /usr/local/cuda/bin and NOT on PATH by default; numpy is not installed system-wide — the suites run under 'uv run --no-project --python 3.12 --with numpy --with pillow python'. scripts/battery-dw-amd-linux.sh <port> <model-id> [work|reason|conc|vision] sets all of that and writes evals/results/DW-AMD-LINUX/ in the leaderboard's names; the 104 harness unit tests pass on this box. AUDITION LINEUP (all llama.cpp, one at a time on the 16 GB card): qwen9b-vl (baseline, same weights as qwen9b + unsloth mmproj-F16, 8x32K q8_0 KV, ~14.2 GiB), qwen4b-vl (Qwen3.5-4B Q8_0 + mmproj, 8x32K, ~13.2 GiB, start bench 7672 prefill / 143.6 gen tok/s), qwen4b-spec (4B + Qwen3.5-0.8B draft, draft-simple n_max 8, 4 slots; start bench 137 tok/s with ~0.6 acceptance — no gain on the bench prompt, to be measured on real work). Vision v1 smoke with enable_thinking=false: 9B 12/20, 4B 15/20; with thinking on at 1024 tokens the 9B answered none of the hard tier (finish_reason=length), hence vision_suite --template-kwargs."
ACCEL=cuda
