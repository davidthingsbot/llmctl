MACHINE_NAME="DW-AMD-LINUX"
NOTES="Single RTX 5080 (16GB), 62GB RAM. llama.cpp only — vLLM is not installed here. The built-in registry describes the dual-3090 box, so ENABLE_BUILTIN_MODELS=0 and models are defined in models.d/. No agents run on this box, hence HERMES/OPENCLAW disabled. llama.cpp REBUILT 2026-09-16 from b9775 (2026-06-23) to b11011 (commit aa39d7a3e): Release + CUDA arch 120 + GGML_NATIVE + OpenMP, nvcc 13.2.78, gcc 13.3, at /home/david/llama.cpp/build-b11011 — LLAMA_SERVER points at that versioned directory; the retired tree is build-b9775-cuda13.2. RENAME TRAP: build-tree binaries carry an absolute RUNPATH into their own bin/, so a build directory renamed after linking cannot find libllama-server-impl.so (status 127, then systemd rate-limits the unit: 'systemctl --user reset-failed llm-<name>' before the next 'llmctl up'). Point LLAMA_SERVER at a versioned build dir instead of renaming. test-backend-ops -b CUDA0 on b11011: 16055/16111, every one of the 56 failures is MUL_MAT/MUL_MAT_ID on iq1_s, iq2_s or iq3_s, and the old b9775 build fails the identical 33 MUL_MAT cases — upstream ggml-org/llama.cpp#28581: nvcc 13.2 miscompiles those three kernels on sm_120 (garbage output, not a slowdown); rebuilding with CUDA 13.3 fixes it (cuda-toolkit-13-3 13.3.1-1 is in apt, not installed). No registered model uses those quants, but IQ1_S / IQ2_S / IQ3_S GGUFs must not be served here until a CUDA 13.3 rebuild; IQ1_M, IQ2_XS/XXS, IQ3_XXS, IQ4_NL/XS and all K-quants pass. qwen9b on b11011: load 2 s, prefill 5449 tok/s, gen 127.6 tok/s (b9775: 133, one bench each, within noise). For the vision audition unsloth/Qwen3.5-{0.8B,4B,9B}-GGUF each ship mmproj-F16.gguf. EVAL TOOLCHAIN (2026-09-16, no passwordless sudo here so everything is user-local): Icarus Verilog 12.0 and Verilator 5.020 built from source into ~/.local (autoconf 2.72 built there first; verilator's man pages need help2man, absent, so its .1 files were touched before 'make install'); nvcc is /usr/local/cuda/bin and NOT on PATH by default; numpy is not installed system-wide — the suites run under 'uv run --no-project --python 3.12 --with numpy --with pillow python'. scripts/battery-dw-amd-linux.sh <port> <model-id> [work|reason|conc|vision] sets all of that and writes evals/results/DW-AMD-LINUX/ in the leaderboard's names; the 104 harness unit tests pass on this box. AUDITION LINEUP (all llama.cpp, one at a time on the 16 GB card): qwen9b-vl (baseline, same weights as qwen9b + unsloth mmproj-F16, 8x32K q8_0 KV, ~14.2 GiB), qwen4b-vl (Qwen3.5-4B Q8_0 + mmproj, 8x32K, ~13.2 GiB, start bench 7672 prefill / 143.6 gen tok/s), qwen4b-spec (4B + Qwen3.5-0.8B draft, draft-simple n_max 8, 4 slots; start bench 137 tok/s with ~0.6 acceptance — no gain on the bench prompt, to be measured on real work). Vision v1 smoke with enable_thinking=false: 9B 12/20, 4B 15/20; with thinking on at 1024 tokens the 9B answered none of the hard tier (finish_reason=length), hence vision_suite --template-kwargs. AUDITION RESULT 2026-09-16 (evals/results/DW-AMD-LINUX/LEADERBOARD.md, all three batteries in ~13 min each, 4 slots x 64K after long_context_retrieval's ~35.4K-token prompt got HTTP 400 at 32K slots): qwen3.5-9b-vl work 218/438, reasoning 157/302, concurrency 119/216/360/355 tok/s; qwen3.5-4b-vl (Q8_0) work 172, reasoning 152, concurrency 132/251/414/400 — the 4B is 11% faster at batch 1 and 15% at 4 streams for -46 on work (verilog_easy 8/16, cuda_easy 6/16, cuda_medium 6/26 vs the 9B's 16/16/26), reasoning within noise. qwen3.5-4b-spec (0.8B draft, draft-simple n_max 8, 2 slots): REJECTED — draft acceptance 15% under the sweep's temperature 0.7 sampling, 33 ms/token vs 7.5 without the draft, concurrency 27/30/30/47; it only broke even on the greedy repetitive start bench (acceptance 0.6-1.0). NOISE FLOOR from the two same-weight 4B runs: work 172 vs 187 and reasoning 152 vs 142 on identical weights, so +-15 on work and +-10 on reasoning is one run's variance; the thinking-on vision rows swing further (hard6 24 vs 14, extra10 13 vs 18) because 4096-token trajectories diverge on batching numerics — compare thinking-off vision rows only: 9B 12/20 v1, 20/39 hard6, 7/30 extra10; 4B 15/20, 16/39, 4/30. GPU Xid 8 (launch timed out, RC watchdog 'GPU is probably locked') killed the 9B once during vision-extra10-think4096 at 14.2 GiB resident; the rerun and every 4B pass were clean, so treat it as transient until it repeats. VERDICT: qwen9b-vl is the box's model — same speed class as the 4B, clearly better coder, vision on. VLA / ROBOTICS (2026-09-17): LeRobot 0.6.1 in ~/.venvs/lerobot with torch 2.11.0+cu130 (sm_120 in the arch list, CUDA works), extras smolvla+pi+async. Checkpoints in ~/models/vla: lerobot/smolvla_base (0.9 GiB, SmolVLM2-500M backbone, 3 cameras at 256x256 + 6-dim state -> 50x6 action chunk) and lerobot/pi05_base (13.5 GiB fp32, PaliGemma 3B, 3 cameras at 224x224 + 32-dim state -> 50x32 chunk). evals/diagnostics/vla_bench.py measured on the 5080 with the chat model stopped: smolvla 0.9 GiB peak VRAM, 79 ms median per 50-action chunk (12 Hz of chunks, 1.7 s of motion per chunk at 30 fps) — fits BESIDE qwen9b-vl only if the chat model is shrunk (qwen9b-vl holds 14.2 GiB). pi05 in bf16 loads all keys but its tokenizer step fetches google/paligemma-3b-pt-224, which is GATED (401 without hf auth login + accepted Google terms); fp32 OOMs (13.5 GiB weights + Chrome's 0.6 GiB). These are NOT llmctl models: they serve via 'python -m lerobot.async_inference.policy_server --host --port' (gRPC; the client picks policy type/path at handshake) and output joint-target chunks, not text — no chat endpoint, no tok/s, eval is task success rate + control-loop Hz. Base checkpoints are per-embodiment and need a fine-tune on teleoperated episodes before driving a real arm."
