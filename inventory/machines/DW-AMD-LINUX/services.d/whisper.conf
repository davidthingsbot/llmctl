DESC="whisper large-v3-turbo q5_0, whisper.cpp CUDA on the RTX 5080, ~136x realtime"
NOTES="whisper.cpp a664346e (master, 2026-09-23) built the same day at /home/david/work/whisper.cpp/build-cuda-a664346e: Release + GGML_CUDA + CUDA arch 120 + GGML_NATIVE + OpenMP, nvcc 13.2 from /usr/local/cuda (not on PATH), gcc 13.3 — the same recipe and RENAME TRAP as llama.cpp build-b11011, hence the versioned build dir. Model is the same ggml-large-v3-turbo-q5_0 as dw-bee-linux so the two boxes compare directly; on a 16 GB card the choice is VRAM budget beside the chat model, not the Vulkan heap: whisper-server holds 1.19 GiB resident (573 MB weights + ~200 MB compute buffers + CUDA context), which fits beside qwen9b-vl at 14.2 GiB. MEASURED 2026-09-23 with no chat model up: whisper-bench encoder 28.7 ms per 30 s window (dw-bee 780M Vulkan: 704 ms, 24x), decode 0.41 ms/token; whisper-cli on the 11 s jfk.wav 316 ms total incl. 187 ms load; via the service a 33 s clip returns in 0.24 s wall = ~136x realtime. NOT the same whisper as the Kina speech server: that is faster-whisper large-v3 fp16 (CTranslate2, ~4 GB VRAM) embedded in ~/work/esp-devices/server/server.py on :8765, launched by its own run.sh, and the two coexist. NO AUTHENTICATION: whisper-server has no API key option, and there is no passwordless sudo here to inspect or change ufw, so the firewall state on 19442 is unverified — bind HOST=127.0.0.1 if nothing on the LAN needs it. --convert is on so clients can post mp3/ogg/flac (ffmpeg 6 is installed). ROUTE: --request-path /v1 --inference-path /audio/transcriptions puts it on the OpenAI audio route (POST /v1/audio/transcriptions, health at /v1/health; the native /inference is gone), so clients use the same dialect as for kokoro on 19443 — the one-speech-interface decision of 2026-09-23. Kina discovers the endpoint from llmctl spec, which reports the flagged path."
HEALTH_PATH=/v1/health
HEALTH_TIMEOUT=120
EXTRA_ARGS="-l auto --request-path /v1 --inference-path /audio/transcriptions"
