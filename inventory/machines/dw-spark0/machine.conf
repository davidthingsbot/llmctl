MACHINE_NAME="dw-spark0"
NOTES="DGX Spark #2 (GB10 Blackwell sm_121, 128GB unified LPDDR5X ~273GB/s, 20 cores, 3.7TB NVMe, CUDA 13.0, driver 580.173.02). REPLACEMENT for the first dw-spark0, which had a dead wired NIC — this unit's enP7s7 links at 1000Mb/s. Same hostname and tailnet identity, different physical box, rebuilt from bare metal 2026-08-31. VRAM_PER_GPU_MB=115000 is set BY HAND, not probed: nvidia-smi reports [N/A] for every memory field on GB10 unified memory, so llmctl falls back to MemTotal (124609) — 115000 leaves the OS ~9.6G. LEGACY_UNITS is deliberately empty (those units belong to DW-ASUS-LINUX). Capacity box, not a speed box: anything that fits in 48GB runs FASTER on the dual 3090s; the only win here is models that do not fit there at all. UNIFIED MEMORY MAKES --gpu-memory-utilization A WHOLE-MACHINE SETTING, AND IT TOOK THE BOX DOWN ON 2026-09-01. On a discrete GPU that flag is a fraction of VRAM and the host RAM is untouched, so 0.9 is routine. On GB10 there is ONE pool: 0.9 means claim 109 of 121 GiB and leave 12 GiB for the OS, desktop and everything else. Loading Mistral-Medium-128B-NVFP4 (82.9 GiB of weights, which fits fine) at GPU_UTIL=0.9 produced a GLOBAL oom-kill at 09:52:02 — the kernel killed chrome and the machine went down two seconds later, needing a reboot. The model was NOT too big; the reservation was. A discrete-GPU box fails the load instead; here it kills the machine, so treat GPU_UTIL as a safety setting rather than a tuning one. RULE: size it from the actual weights — util = (weights_gib + ~14 GiB for KV and activations) / 121 — and NEVER leave the OS under ~24 GiB. Values set 2026-09-01: qwen38-27b-fp8 0.34, qwen38-27b-nvfp4 0.29, nemotron-120b 0.69, mistral-medium-128b 0.80 (was 0.75/0.75/0.88/0.90 — every one of them dangerously over-reserved). Cross-check: llama.cpp does not have this failure mode because it allocates what the model needs rather than a fraction of the machine, which is why Flash-Next at 87 GiB was stable all session. There is now 16G of swap, which softens but does not remove the risk."
ACCEL=cuda
GPUS_DEFAULT="0"
TENSOR_PARALLEL_DEFAULT=1
VRAM_PER_GPU_MB=115000
VLLM_BIN="/home/david/.venvs/vllm/bin/vllm"
LLAMA_SERVER="/home/david/work/llama.cpp/build/bin/llama-server"
MODELS_DIR="/home/david/models"
WIZARD_BASE_PORT=19438
ENABLE_BUILTIN_MODELS=0
WEBUI_ENABLE=1
WEBUI_CONTAINER="open-webui"
WEBUI_PORT=8088
WEBUI_IMAGE="ghcr.io/open-webui/open-webui:main"
LEGACY_UNITS=""
