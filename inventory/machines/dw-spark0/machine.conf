MACHINE_NAME="dw-spark0"
NOTES="DGX Spark #2 (GB10 Blackwell sm_121, 128GB unified LPDDR5X ~273GB/s, 20 cores, 3.7TB NVMe, CUDA 13.0, driver 580.173.02). REPLACEMENT for the first dw-spark0, which had a dead wired NIC — this unit's enP7s7 links at 1000Mb/s. Same hostname and tailnet identity, different physical box, rebuilt from bare metal 2026-08-31. VRAM_PER_GPU_MB=115000 is set BY HAND, not probed: nvidia-smi reports [N/A] for every memory field on GB10 unified memory, so llmctl falls back to MemTotal (124609) — 115000 leaves the OS ~9.6G. LEGACY_UNITS is deliberately empty (those units belong to DW-ASUS-LINUX). Capacity box, not a speed box: anything that fits in 48GB runs FASTER on the dual 3090s; the only win here is models that do not fit there at all."
ACCEL=cuda
GPUS_DEFAULT="0"
TENSOR_PARALLEL_DEFAULT=1
VRAM_PER_GPU_MB=115000
VLLM_BIN="/home/david/.venvs/vllm/bin/vllm"
LLAMA_SERVER="/home/david/work/llama.cpp/build/bin/llama-server"
MODELS_DIR="/home/david/models"
WIZARD_BASE_PORT=19438
ENABLE_BUILTIN_MODELS=0
WEBUI_ENABLE=1
WEBUI_CONTAINER="open-webui"
WEBUI_PORT=8088
WEBUI_IMAGE="ghcr.io/open-webui/open-webui:main"
LEGACY_UNITS=""
