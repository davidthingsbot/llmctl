KIND=kokoro
PORT=19460
IMAGE="ghcr.io/remsky/kokoro-fastapi-cpu:latest"
HOST=0.0.0.0
DESC="Kokoro-82M TTS, CPU (arm64 image), OpenAI-compatible /v1/audio/speech"
NOTES="ghcr.io/remsky/kokoro-fastapi-cpu:latest has a native arm64 manifest, pulled 2026-09-25 on dw-spark0 only (one-box image pulls). CPU by choice: 82M params, and the GB10's unified pool is the scarce resource beside a TP2 chat model — the container's ~1.5 GB RSS still comes out of that pool. NO AUTHENTICATION and ufw is disabled on this box: 0.0.0.0 exposes it to LAN and Tailscale. MEASURED 2026-09-25 (20 Grace cores, torch 2.8.0+cpu, all 20 threads, mkldnn on): 5.65 s of af_bella audio in 3.35 s wall warm = 1.7x realtime, first request 3.48 s — far below the x86 boxes (9950X3D 15x, Zen 4 8C 6.2x); usable for sentence-length TTS, not for long passages. Container RSS 1.1 GiB. Output 24 kHz mono WAV; /v1/audio/voices lists 72 voices. Untried: the arm64 kokoro-fastapi-gpu image, which would need a torch that runs on sm_121. THREADS: measured 2026-09-25 on a 12.8 s render — 20 threads unpinned 3.70 s, 12 threads 4.3 s (worst: the pool straddles the big.LITTLE split and waits on A725 cores), 8 threads 3.05 s, 10 threads pinned to the ten Cortex-X925 cores (cpu 5-9,15-19; cpu_capacity 997-1024 vs 718-731 for the A725s) 3.08 s = ~4.1x realtime, hence the EXTRA_ARGS below. The pin shares the fast cores with the chat model's worker processes, but kokoro is idle between renders."
HEALTH_PATH=/health
HEALTH_TIMEOUT=300
EXTRA_ARGS="-e OMP_NUM_THREADS=10 --cpuset-cpus=5-9,15-19"
