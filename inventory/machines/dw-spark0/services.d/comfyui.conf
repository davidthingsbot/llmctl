KIND=comfyui
PORT=8188
PYTHON="/home/david/ComfyUI/.venv/bin/python"
APP_DIR="/home/david/ComfyUI"
HOST=0.0.0.0
DESC="ComfyUI 0.37 on the GB10 (video: LTX-2.5, Wan 2.2, MiniMax H3), master of the two-Spark Distributed pair"
NOTES="Borrows the whole GB10 unified pool (LTX-2.5 22B + a 14 GB text encoder; H3 pruned 21 GB + a 32B nvfp4 TE), so it is LEND=1: `llmctl lend` starts it after the cluster model is down and `reclaim` stops it first. Set up 2026-09-28/29. --fast-disk = disk-backed dynamic weight loading (without it ComfyUI pins a private copy of the weights: 47 GB RSS for one LTX render on the Asus vs 19 GB with it). --enable-cors-header is required by ComfyUI-Distributed (custom_nodes/), which shows dw-spark1's identical instance (192.168.64.196:8188, driven by the comfyui-spark1.service ssh wrapper in LEND_UNITS) as a remote worker in this UI's Distributed panel; the browser talks to the worker directly, hence CORS. Models live outside the checkout: ~/models/comfyui (shared with the Asus via rsync) and ~/models/comfyui-spark (Spark-only nvfp4/fp8 builds, H3) through extra_model_paths.yaml; new files must also be rsynced to dw-spark1 over the fabric (10.100.100.11). Measured 2026-09-29: stock LTX-2.5 5 s i2v 113 s cold (3090 with offload: 140-180 s), single-stage 1536x1152 ~250 s, Wan 2.2 20-step CFG 832x624 5 s = 18 min; GPU 83 C / 90 W at full load, no throttling. NO AUTHENTICATION and no firewall on this box: the LAN is the access control."
HEALTH_PATH=/system_stats
HEALTH_TIMEOUT=120
EXTRA_ARGS="--fast-disk --enable-cors-header"
LEND=1
