float32 Mamba SSM cache init. NEXT: run it standalone with VLLM_LOGGING_LEVEL=DEBUG and HEALTH_TIMEOUT 5400 to see where the 40 minutes go before deciding whether this model is servable here at all. Do NOT put it back in a sweep until that is answered — it cost 41 minutes of a 5-model run for nothing. ROOT CAUSE FOUND 2026-09-01 18:57 WITH VLLM_LOGGING_LEVEL=DEBUG: the 40-minute silence is FlashInfer JIT-compiling the sm_120 fused-MoE kernel — ~/.cache/flashinfer/0.6.16.post3/121a/generated/cutlass_instantiations holds 68 CUTLASS .cu files for fused_moe_120, each a heavy template compile (~2.6 GiB of cicc, minutes each). Weight loading is NOT the problem: 40 MoE layers x 512 experts load at ~11 s/layer, done in 7 minutes, single-threaded, memory pre-allocated so RSS is flat. The first two attempts OOM'd because the 68 compiles ran in PARALLEL (default MAX_JOBS); the third ran them one at a time under MAX_JOBS=1 and hit the 2400s timeout at 17:40, leaving fused_moe_120 unbuilt so the next attempt started over. It is a ONE-TIME cost: once built it is cached and reused (fp4_gemm_cutlass_sm120, built 10:19, has been reused since). Setting: MAX_JOBS=4 (4 x 2.6 GiB against 40+ GiB free), NVCC_THREADS=2, HEALTH_TIMEOUT 7200 for the first build only. Also seen every MoE layer: 'Unexpected gate/up projection names: up_proj. Fused gate/up mapping will be skipped' — a checkpoint-naming mismatch under vLLM 0.28.0; likely a throughput cost, worth checking once serving. BUILD SUCCEEDED 2026-09-01 19:16 under MAX_JOBS=4: fused_moe_120.so is now cached in ~/.cache/flashinfer and later loads skip the 17-minute compile entirely. MEMORY PEAKED AT 109/121 GiB with 9 compiler processes alongside the 78 GiB resident model — 12 GiB of headroom. MAX_JOBS=4 is the CEILING here, not a starting point; do not raise it. Once the cache exists the first-build settings no longer matter, but deleting ~/.cache/flashinfer brings all of this back. SERVING VERIFIED 2026-09-01 19:17, 13.3 tok/s single-stream. THINKING BEHAVIOUR: Nemotron-3 thinks by default and, like DeepSeek-V4 and Qwen3.8, its template emits the opening <think> INTO THE PROMPT — with thinking on, content holds the whole untagged monologue ('User asks: ... So answer: 391') and reasoning_content is empty; with the '/no_think' system prompt the output ends '</think>\n391', an orphan close tag. chat_template_kwargs {enable_thinking:false} suppresses it CLEANLY (4 tokens, '391'), which is what both eval suites send by default, so scores are unaffected. For thinking-on serving the candidate is --reasoning-parser nemotron_v3 — UNTESTED, and vLLM's qwen3 parser silently swallowed every response on Qwen3.8 for the same prompt-side-tag reason, so test it against a bare 'Hi' before trusting it. 'detailed thinking off' as a system prompt does NOT work on this build."
