NOTES="Qwen3.8-Flash-Next, released 2026-08-26 — the Qwen3.8-generation 100-200B model the 2026-08-22 model survey said to watch for, and the reason its round-3 conclusion ('every model that fits 128GB is an older generation than Qwen3.8-27B') no longer holds. 125B backbone + 51B n-gram (PLE) embedding + 4B MTP = 180B on disk, but only 6B ACTIVE per token: 512 experts, 10 routed + 1 shared. 48 layers, 3x Gated DeltaNet then 1x Qwen Sparse Attention per 4-layer block. 262144 native context, 1M via YaRN. Licence qwen-community-1.0, NOT Apache-2.0. Officially an experimental preview of the Qwen4 architecture. arch 'qwen4exp' in llama.cpp, merged in PR 27742 — REQUIRES a build at/after that; master 458681e (2026-08-31) has it. VLLM IS NOT AN OPTION AT THIS SIZE: the official FP8 checkpoint is 172.78 GiB and Qwen lists DGX Spark only as a CLUSTER target ('not on a workstation'), validated on GB300 TP2 and 8xH200; the one NVFP4 repo (vcruz305) is an empty placeholder whose card says it is filled last, after the GGUF ladder. THE PLE TABLE DOMINATES SIZING: per_layer_token_embd is a SINGLE tensor, shape [160, 320001536], 51.2B params, 102.4 GB at BF16. Its quantised dimension (160) is not divisible by 256, so it CANNOT be a K-quant — at Q6_K it falls back to Q8_0 (~54.4 GB) in its own shard. That is why shard 2 of this download is 49.8 GB and shard 1 only 10.9 MB. Roughly half of any file in this ladder is lookup table, not compute weights, and it is not quantised below 4-bit because of its random access pattern. DO NOT TAKE THE STANDARD ADVICE TO OFFLOAD THE PLE TO SSD WITH mmap: on GB10 'offload to host memory' is a NO-OP because host and GPU share one pool, and the DW-ASUS-LINUX notes measured mmap'd weights being re-read from disk every token at 1.48 vs 6.39 tok/s (4.3x) — budget for it resident. Ladder: UD-IQ1_S 72.5 / IQ1_M 74.5 / Q2_K_XL 78.9 / IQ3_XXS 82 / Q3_K_XL 90 / IQ4_XS 93.7 / Q4_K_XL 111.3 GB; IQ4_XS chosen as the largest leaving real KV headroom inside VRAM_PER_GPU_MB=115000 (87.2 GiB weights, ~25 GiB spare). Q4_K_XL at 103.7 GiB would leave only ~8.6. UNTESTED HYPOTHESIS worth measuring: at 6B active it should decode ~2x faster than REAP-150B's 15.8 tok/s AND may actually batch, where REAP-150B's aggregate throughput is FLAT across 1/2/4 streams — that flatness was a 13B-active model saturating ~273GB/s, so a 3B-lighter activation may scale where it could not. Sampling flags are Unsloth's documented values for this model (temp 1.0, top-p 0.95, top-k 20, min-p 0.0); the eval suites send temperature 0 in the payload and override them. Benchmarks vs the incumbents: LiveCodeBench v6 91.9 (DeepSeek V4-Flash 91.6, Qwen3.8-27B 90.3), SWE-bench Pro 62.5 (27B 61.7), CoWorkBench 73.9 (70.7), JobBench 55.7 (33.4) — the agentic gap is the real jump, the coding deltas are noise-adjacent, and DeepSeek V4-Flash still WINS NL2Repo-Bench 54.2 vs 48.1. Its 6B active is also the sixth test of this repo's active-parameter rule, which REAP-150B broke for the first time. VLLM IS NOT AN OPTION ON THIS BOX AS OF 2026-09-02, FOR THREE INDEPENDENT REASONS. (1) ARCHITECTURE: the class is Qwen4ExpForConditionalGeneration / model_type qwen4_exp; vLLM 0.28.0's registry has Qwen3NextForCausalLM (a different, older model) and nothing for it. Day-0 support exists upstream (PR #53896) but the official recipe requires 0.29.0+ / nightly, says PyPI install is NOT supported, and ships only as the Docker image vllm/vllm-openai:qwen38-flash-next. (2) SIZE: every safetensors quant on HF is 126-175 GiB against 121 GiB of RAM — RadixArk NVFP4 is the smallest at 125.9 GiB, and its shard names (model-plefp8-*, model-bf16-*) show why: the 51B n-gram/PLE table is kept at FP8 (~51 GiB) and some tensors at bf16. The IQ4_XS GGUF fits at 87 GiB only because llama.cpp quantises the PLE to ~4 bits. (3) OFFLOAD IS A NO-OP HERE: vLLM's VLLM_PLE_CPU_OFFLOAD=1 moves the table to HOST RAM, which on GB10 is the same 121 GiB pool; there is no disk/mmap offload. WHAT WOULD CHANGE IT: a second Spark (TP2, 256 GiB — even the official 172.78 GiB FP8 fits), or a vLLM PLE disk-offload that does not exist, or a quant that shrinks the PLE, which none do. Building vLLM main from source on aarch64 would clear (1) alone and still leave (2). Stay on llama.cpp for this model."
