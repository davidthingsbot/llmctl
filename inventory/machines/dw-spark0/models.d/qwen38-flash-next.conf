NOTES="Qwen3.8-Flash-Next, released 2026-08-26 — the Qwen3.8-generation 100-200B model the 2026-08-22 model survey said to watch for, and the reason its round-3 conclusion ('every model that fits 128GB is an older generation than Qwen3.8-27B') no longer holds. 125B backbone + 51B n-gram (PLE) embedding + 4B MTP = 180B on disk, but only 6B ACTIVE per token: 512 experts, 10 routed + 1 shared. 48 layers, 3x Gated DeltaNet then 1x Qwen Sparse Attention per 4-layer block. 262144 native context, 1M via YaRN. Licence qwen-community-1.0, NOT Apache-2.0. Officially an experimental preview of the Qwen4 architecture. arch 'qwen4exp' in llama.cpp, merged in PR 27742 — REQUIRES a build at/after that; master 458681e (2026-08-31) has it. VLLM IS NOT AN OPTION AT THIS SIZE: the official FP8 checkpoint is 172.78 GiB and Qwen lists DGX Spark only as a CLUSTER target ('not on a workstation'), validated on GB300 TP2 and 8xH200; the one NVFP4 repo (vcruz305) is an empty placeholder whose card says it is filled last, after the GGUF ladder. THE PLE TABLE DOMINATES SIZING: per_layer_token_embd is a SINGLE tensor, shape [160, 320001536], 51.2B params, 102.4 GB at BF16. Its quantised dimension (160) is not divisible by 256, so it CANNOT be a K-quant — at Q6_K it falls back to Q8_0 (~54.4 GB) in its own shard. That is why shard 2 of this download is 49.8 GB and shard 1 only 10.9 MB. Roughly half of any file in this ladder is lookup table, not compute weights, and it is not quantised below 4-bit because of its random access pattern. DO NOT TAKE THE STANDARD ADVICE TO OFFLOAD THE PLE TO SSD WITH mmap: on GB10 'offload to host memory' is a NO-OP because host and GPU share one pool, and the DW-ASUS-LINUX notes measured mmap'd weights being re-read from disk every token at 1.48 vs 6.39 tok/s (4.3x) — budget for it resident. Ladder: UD-IQ1_S 72.5 / IQ1_M 74.5 / Q2_K_XL 78.9 / IQ3_XXS 82 / Q3_K_XL 90 / IQ4_XS 93.7 / Q4_K_XL 111.3 GB; IQ4_XS chosen as the largest leaving real KV headroom inside VRAM_PER_GPU_MB=115000 (87.2 GiB weights, ~25 GiB spare). Q4_K_XL at 103.7 GiB would leave only ~8.6. UNTESTED HYPOTHESIS worth measuring: at 6B active it should decode ~2x faster than REAP-150B's 15.8 tok/s AND may actually batch, where REAP-150B's aggregate throughput is FLAT across 1/2/4 streams — that flatness was a 13B-active model saturating ~273GB/s, so a 3B-lighter activation may scale where it could not. Sampling flags are Unsloth's documented values for this model (temp 1.0, top-p 0.95, top-k 20, min-p 0.0); the eval suites send temperature 0 in the payload and override them. Benchmarks vs the incumbents: LiveCodeBench v6 91.9 (DeepSeek V4-Flash 91.6, Qwen3.8-27B 90.3), SWE-bench Pro 62.5 (27B 61.7), CoWorkBench 73.9 (70.7), JobBench 55.7 (33.4) — the agentic gap is the real jump, the coding deltas are noise-adjacent, and DeepSeek V4-Flash still WINS NL2Repo-Bench 54.2 vs 48.1. Its 6B active is also the sixth test of this repo's active-parameter rule, which REAP-150B broke for the first time. VLLM IS NOT AN OPTION ON THIS BOX AS OF 2026-09-02, FOR THREE INDEPENDENT REASONS. (1) ARCHITECTURE: the class is Qwen4ExpForConditionalGeneration / model_type qwen4_exp; vLLM 0.28.0's registry has Qwen3NextForCausalLM (a different, older model) and nothing for it. Day-0 support exists upstream (PR #53896) but the official recipe requires 0.29.0+ / nightly, says PyPI install is NOT supported, and ships only as the Docker image vllm/vllm-openai:qwen38-flash-next. (2) SIZE: every safetensors quant on HF is 126-175 GiB against 121 GiB of RAM — RadixArk NVFP4 is the smallest at 125.9 GiB, and its shard names (model-plefp8-*, model-bf16-*) show why: the 51B n-gram/PLE table is kept at FP8 (~51 GiB) and some tensors at bf16. The IQ4_XS GGUF fits at 87 GiB only because llama.cpp quantises the PLE to ~4 bits. (3) OFFLOAD IS A NO-OP HERE: vLLM's VLLM_PLE_CPU_OFFLOAD=1 moves the table to HOST RAM, which on GB10 is the same 121 GiB pool; there is no disk/mmap offload. WHAT WOULD CHANGE IT: a second Spark (TP2, 256 GiB — even the official 172.78 GiB FP8 fits), or a vLLM PLE disk-offload that does not exist, or a quant that shrinks the PLE, which none do. CORRECTION: vllm/vllm-openai:qwen38-flash-next IS published for linux/arm64 (checked 2026-09-02 with docker manifest inspect), so (1) is clearable with a docker pull on this aarch64 box — no source build needed. (2) and (3) still stand, so it remains unservable here alone. The moment a second Spark exists, that arm64 image is the TP2 path: the recipe's official 172.78 GiB FP8 fits 256 GiB with room for KV. Until then, stay on llama.cpp for this model. TP2 ACROSS TWO SPARKS WAS TRIED 2026-09-04 AND DOES NOT FIT EITHER, FOR A REASON THE SIZING MISSED. Setup: official image vllm/vllm-openai:qwen38-flash-next (arm64, v0.1.dev20073+g8e685d198), eugr/spark-vllm-docker launcher in no-Ray mode over the 200G fabric (10.100.100.10/11), FP8 checkpoint mirrored to both boxes, scripts/flashnext-fp8-tp2.sh. NCCL rendezvous and weight loading worked every time (86.22 GiB per box in 12-14 min, single-threaded loader, disk idle). Every attempt then died within 40 s of loading: attempt 1 (util 0.80, 256K, 8 seqs) locked spark0 up hard — NVRM NV_ERR_NO_MEMORY from 00:25:51, no console, physical reboot at 00:34, and spark1 needed one too; attempts 2 and 3 (0.77, 128K, 4 seqs; then also text-only --limit-mm-per-prompt image=0 and 4096 batched tokens) were killed by a user-space guard (~/ops/memguard.sh, docker kill at MemAvailable<3 GiB) with both machines surviving. ROOT CAUSE, measured with --load-format dummy and a 2 s sampler: each rank allocates 63 GiB of compute weights (half of 122, as expected) and then the FULL 51 GiB n-gram table — the vocab-sharding in vllm/models/qwen4_exp/common/ple.py is in the loader only; the allocation is per-rank replicated. With real weights the loader writes only its half, so "Model loading took 86 GiB" is physical-touched memory, and the untouched half (22-25 GiB) gets committed on the first forward. Per-box model footprint is therefore ~112 GiB, plus ~14 GiB of runtime (worker 7.4 GiB host RSS, engine + API ~2, CUDA/NCCL ~3, OS ~2), against 121: impossible with the table resident. VLLM_PLE_CPU_OFFLOAD=1 refuses multi-node outright ("Unsupported settings: nnodes=2"), so the offload escape hatch is single-node only. The GitHub two-Spark report (vllm#54919, util 0.80, 1M ctx, 10-11 GiB free) is therefore unexplained by this build; treat it as a different image/version, not a recipe. Desktop is not the lever: the GNOME session measures 0.56 GiB. WHAT WOULD FIT: RadixArk/Qwen3.8-Flash-Next-NVFP4 (125.9 GiB) -> ~37.5 GiB compute per rank + the full 51 GiB FP8 table = ~88.5 GiB per box, ~19 GiB left for runtime and KV — tight but the transient that killed FP8 was the table itself; or the DeepSeek-V4-Flash-0731 official checkpoint, which has an actual two-Spark recipe and is 9 GiB per box lighter than Flash-Next FP8. Until then this model stays on llama.cpp here (IQ4_XS, PLE quantised to ~4 bit, 87 GiB, one box)."
