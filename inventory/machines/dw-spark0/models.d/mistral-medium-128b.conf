NOTES="CONFIRMED ON THIS BOX 2026-09-01: loading without --limit-mm-per-prompt dies with ValueError: Failed to apply PixtralProcessor on data={'text': '[IMG]'} after ~15s. That is EXACTLY incompatibility 2 recorded on DW-ASUS-LINUX against a different checkpoint and vLLM 0.23.0 — the note survived a hardware change, a model change and five vLLM releases. Mistral-Medium-3.5-128B-NVFP4 (NVIDIA build): 128B DENSE, ~84B active after quant, NVFP4 on MLP layers 4-86 with edge layers + attention left FP8, modelopt. arch Mistral3ForConditionalGeneration, 89G on disk, 256K native context, multimodal. THIS IS A RETEST OF A MODEL THIS PROJECT ALREADY REJECTED, and that is the point: DW-ASUS-LINUX tested Mistral-Medium-3.5 at UD-IQ2_M on the 3090s and it lost (4/6 objective, technical 2/5, 13.7 tok/s) to Qwen3.6-27B dense FP8 — but that was a 2-BIT GGUF and the quant was the leading suspect. This is the full-width NVFP4 build, so it is the fair test of whether the rejection was the model or the quantisation. Survey credits it with the best AIME 2025 (88.75) and long-context AA-LCR (65.10) of anything that fits 128GB, plus MMLU-Pro 82.20 and MMMU Pro 62.79. EXPECT IT TO BATCH WELL: measured on this box 2026-09-01, dense Qwen3.8-27B under vLLM scaled 6.79x from 1 to 8 streams (7.7 -> 52.3 aggregate tok/s) with per-stream barely moving, because batching amortises weight reads — whereas sparse MoE decode with distinct per-token experts is FLAT. Dense is the shape that batches on this hardware. THREE MISTRAL-vs-vLLM INCOMPATIBILITIES recorded on DW-ASUS-LINUX with vLLM 0.23.0 and a different checkpoint, unverified here: (1) load dies with 'CachedMistralCommonBackend has no attribute is_fast' when the repo ships model-0000N-of-*.safetensors rather than consolidated*.safetensors — fix with --tokenizer-mode mistral; (2) multimodal profiling dies on 'Mismatch in image token count' — fix with --limit-mm-per-prompt '{image:0}'; (3) both eval suites HTTP 400 on chat_template_kwargs, needing --no-template-kwargs. DO NOT pre-emptively delete tekken.json to dodge 1 and 2: it clears them but transformers then loads a tokenizer.json with an INCORRECT REGEX PATTERN unless fix_mistral_regex=True, which would not crash anything and would instead make every quality number quietly wrong. EXTRA_ARGS starts empty deliberately — add flags only against an observed failure, per the Qwen3.8 reasoning-parser lesson (a flag copied forward from an older model and vLLM version silently discarded every response)."
