NOTES="DeepSeek-V4-Flash-0731-reap-150b, 132 routed experts (REAP-pruned from 256), 43 layers, 6 experts/token, arch deepseek_v4. MXFP4_MOE IS THE BASELINE, NOT A QUANT: DeepSeek ships the routed experts in MXFP4 already and llama.cpp's converter repacks them without changing a value, so this file is numerically identical to the safetensors checkpoint — every rung below it (Q3_K_M/IQ3_XXS/Q2_K) is a REQUANTIZATION of already-4-bit data and costs more than the same rung from bf16. 79.21 GiB of weights. TAKE REAP, NEVER REAM: vendor benchmarks give REAP-150B a 0.8248 mean (GSM8K 0.9295 / MATH-500 0.7140 / HumanEval+ 0.8963 / MBPP+ 0.7593) against REAM-150B's 0.6952 — REAP at 132 experts actually beats the 284B base model by +0.80 mean, REAM loses 12.16. That matches this project's own paired evals on the FIRST dw-spark0 (2026-08-23): REAP work_quality 91/100 — the best work score ever recorded in this repo, beating Qwen3.8-27B's 83 — deep_reasoning 57; REAM 69/52 and REJECTED (pattern tasks fine, quantitative collapse, and it emitted raw <tool_calls> XML the deepseek_v4 parser missed). DIVISION OF LABOUR: REAP-150B for engineering work, a Qwen for open reasoning. CARRIED OVER FROM THE FIRST SPARK, RE-VERIFY ON THIS ONE: KV measured 8.33 KiB/token by memory differencing, so 1M total context costs ~8.5G and 4x256K slots land at ~90G footprint; single-stream 15.3 tok/s, prefill ~590 tok/s, TTFT ~250ms. CRITICAL AND COUNTERINTUITIVE: aggregate throughput is FLAT at ~15.4 tok/s across 1/2/4 streams — a bandwidth-bound MoE decode with distinct per-token experts gets ZERO batching gain on ~273GB/s, so per-stream throughput simply divides. Do not size concurrency expecting vLLM-style scaling here. MTP modules are absent from this checkpoint, so MTP speculative decoding is unavailable. Thinking is ON by default (template embedded in the GGUF); --reasoning-format deepseek splits it into reasoning_content, and eval runs disable it with chat_template_kwargs enable_thinking=false. Full GPU offload (-ngl 99, which llmctl passes) is the only configuration the publisher verified."
