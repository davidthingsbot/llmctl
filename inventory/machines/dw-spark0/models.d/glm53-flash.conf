NOTES="First model to serve across both Sparks, 2026-09-04 08:49. RedHatAI/GLM-5.3-Flash-NVFP4 (184.2 GiB, 11 shards) mirrored to both boxes; image vllm/vllm-openai:glm53-flash plus Libertai/vllm-sparse-mla-blackwell built for sm_121 into ~/opt/glm53ext on each node (the stock image has no sparse-MLA lane for this rope-free MLA on the SM120 family: vllm#53963). Launch script scripts/glm53-flash-tp2.sh follows the kernel's own 2x GB10 lane: eager, fp8 KV, block 256, flashinfer_cutlass MoE, 2 seqs, 2048 batched tokens, text-only. Measured: weights 88.44 GiB per box in 5m52s, healthy at 521 s, KV 9.21 GiB = 1,164,044 tokens, ~14 tok/s at batch 1 (MTP would give ~24). Steady state leaves ~8.5 GiB on spark0 and ~11 on spark1, so VRAM_MB below is the MemAvailable every node needs BEFORE starting (weights + runtime + KV): downloads and other loads must stop first. Pre-flight with random weights (~/ops/dummy-check.sh) took 146 s and is the gate before any config change. Vision is off (image=0) to fit; David wants it back."
