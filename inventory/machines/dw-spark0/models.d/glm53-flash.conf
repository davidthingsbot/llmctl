DESC="GLM-5.3-Flash 320B-A18B NVFP4, vLLM TP2 across dw-spark0 + dw-spark1"
NOTES="First model to serve across both Sparks, 2026-09-04 08:49. RedHatAI/GLM-5.3-Flash-NVFP4 (184.2 GiB, 11 shards) mirrored to both boxes; image vllm/vllm-openai:glm53-flash plus Libertai/vllm-sparse-mla-blackwell built for sm_121 into ~/opt/glm53ext on each node (the stock image has no sparse-MLA lane for this rope-free MLA on the SM120 family: vllm#53963). Launch script scripts/glm53-flash-tp2.sh follows the kernel's own 2x GB10 lane: eager, fp8 KV, block 256, flashinfer_cutlass MoE, 2 seqs, 2048 batched tokens, text-only. Measured: weights 88.44 GiB per box in 5m52s, healthy at 521 s, KV 9.21 GiB = 1,164,044 tokens, ~14 tok/s at batch 1 (MTP would give ~24). Steady state leaves ~8.5 GiB on spark0 and ~11 on spark1, so VRAM_MB below is the MemAvailable every node needs BEFORE starting (weights + runtime + KV): downloads and other loads must stop first. Pre-flight with random weights (~/ops/dummy-check.sh) took 146 s and is the gate before any config change. Vision is off (image=0) to fit; David wants it back. 2026-09-06: window raised 65536 -> 524288 (pre-flight PASS, pool 1,144,279 tokens = 2.18 full-window requests, 14.2 tok/s unchanged, headroom unchanged at ~7/11 GiB). WHY NOT 1M: --max-model-len is a per-request cap inside the pool, but the sparse-MLA prefill workspace (5 x max_model_len x 576 x 2 B) and the indexer prefill buffer (40 x max_model_len x 132 B) are sized from it too: 0.7 GiB at 64K, 4.3 at 512K, 8.6 at 1M, which left 2.36 GiB for KV at 1M against the 5.98 GiB one 1M request needs (pre-flight FAIL 2026-09-05, vLLM estimated 400K max at util 0.83). 1M needs util 0.86 for exactly one resident request, or a smaller workspace multiplier; two concurrent 1M sessions are out of reach on two boxes. HERMES: its custom-provider profile sends max_tokens=65536 by default (no model.max_tokens in config.yaml), so at a 64K window every Telegram turn was a 400 followed by a 600 s compression stall; inside 512K that request succeeds (smoke 08:04)."
VRAM_MB=105000
HEALTH_TIMEOUT=1500
NODES="dw-spark1"
