NOTES="DO NOT SET --reasoning-parser qwen3 ON THIS MODEL. Measured on vLLM 0.28.0, 2026-09-01: it silently swallows the ENTIRE response — content AND reasoning_content both empty, every request, finish_reason length after burning the whole max_tokens budget. Cause: Qwen3.8 chat template emits the opening <think> INTO THE PROMPT, so the model generates only the CLOSING </think>; the parser scans for an opening tag that never arrives and discards everything. With no parser the same request returns content of 134 chars in 9s, correctly, with a bare </think> separating thinking from answer — strip through the final </think> client-side (the eval suites now have --strip-reasoning for exactly this). NOTE the DW-ASUS-LINUX guidance that this flag is REQUIRED was correct for Qwen3.6 on vLLM 0.23.0 and does not carry to Qwen3.8 on 0.28.0 — re-verify reasoning parsers per model AND per vLLM version. THIS IS THE SAME ROOT CAUSE as the DeepSeek-V4 template issue on llama.cpp (see the dw-spark0 chat-templates/ patch): modern reasoning checkpoints put the opening tag in the prompt, and every parser that expects it in the output fails the same way, silently. Qwen3.8-27B dense, FP8 (e4m3), arch Qwen3_5ForConditionalGeneration — registered in vLLM 0.28.0's model registry on this box (378 archs, verified). Same quantisation as DW-ASUS-LINUX's qwen38-27b-fp8, which scored work 83 / deep_reasoning 71 on dual RTX 3090s, so a run here is a SAME-BOX control for the Flash-Next comparison and also a check on how much of those numbers were machine-specific. 27.8B DENSE: every parameter is read per token, so on this ~273GB/s box it is bandwidth-punished far harder than the MoEs — expect it to be SLOWER here than on the 3090s (~936GB/s each), which is the capacity-not-speed tradeoff this machine exists to make. Qwen3.8 thinks by default, hence --reasoning-parser qwen3; without it the model streams into reasoning_content and a throughput script counting only content records ZERO tokens (DW-ASUS-LINUX learned this the hard way). GPU_UTIL 0.75 leaves room beside nothing else — this model cannot co-reside with qwen38-flash-next (87.2 GiB) in 121 GiB, so llmctl set switches between them."
