NOTES="Validated 2026-08-27 on llama.cpp b10276 / Vulkan gfx1150. Source unsloth/Qwen3.6-35B-A3B-GGUF, file Qwen3.6-35B-A3B-Q8_0.gguf, 36,903,140,320 bytes (34.37 GiB), byte-size verified against the Hub tree API. Tuning is a deliberate byte-for-byte copy of 35b-a3b-q5 (1,048,576-token unified q8_0 KV pool, 4 streams, 262,144 per-request ceiling, 2 GiB prompt cache, batch/ubatch 2048, identical sampler) so any observed difference is attributable to the quant alone. MEASURED: loads in 64 s and used 45.17 GiB of the fixed 48 GiB allocation, leaving 2.83 GiB headroom. The pre-flight projection was 45.17 GiB derived from the q5 baseline (35.44 GiB total minus 24.64 GiB weights = 10.80 GiB non-weight, assumed quant-independent, plus 34.37 GiB of q8_0 weights); measurement matched that projection exactly, which confirms the non-weight KV-plus-compute figure is independent of weight quantization on this architecture. Startup benchmark 1,542-token prefill in 4.081 s: 377.8 tok/s prefill and 19.7 tok/s generation, versus 352.9 and 21.1 for the q5 on the identical bench. Q8_0 is 7.05 percent FASTER at prefill and 6.64 percent SLOWER at generation. That split is the expected signature of a bandwidth-bound APU: prefill is compute-bound and benefits from the cheaper q8_0 dequantisation, while generation is memory-bandwidth-bound and pays for 9.73 GiB of extra weights read per token. The 2.83 GiB headroom is BELOW the 3.75 GiB that coder-next-iq4-xs records as its memory-safe compromise; it is an accepted risk taken by explicit user choice on 2026-08-27. Note vram_ok() is CUDA-only and a no-op on this rocm machine, so there is no pre-flight guard. The KV pool is unified and pre-allocated at load, so the footprint should be static, but four simultaneously populated 256K histories have NOT been stress-tested at this headroom and are the main residual risk. Documented fallback if headroom proves insufficient: halve SERVER_CTX to 524288, freeing roughly 3.4 GiB but dropping usable concurrency from 4 streams to 2 at the 256K ceiling. The q5 baseline, from 2026-08-05 at C1, is work-quality-v1 88/100 in 218.59 s and deep-reasoning-v1 69/100 in 98.38 s, with a three-judge blind open-response average of 17.57/20. Quality suites run 2026-08-27 at C1 against the live :19442 server, both suites pinning temperature 0 so the comparison is greedy-decode and not sampling noise. Work-quality-v1 scored 86/100 in 225.70 s versus 88/100 in 218.59 s for the q5, and deep-reasoning-v1 scored 65/100 in 108.15 s versus 69/100 in 98.38 s, so the q8_0 is 2 and 4 points LOWER and 3.25 and 9.93 percent SLOWER respectively. Critically, every exactly-graded or executable task was a dead tie: strict protocol JSON 12/12, BOM consolidation 10/10, code repair 20/20, embedded C review 12/12, 35K retrieval 16/16, scope control 6/6, acquisition timing 0/6, logic grid 0/12, hypothesis discrimination 12/12 and Wason 9/10 all matched the q5 exactly. All movement was confined to rubric-graded reasoning: protocol architecture 12->10, Bayesian updating 8->4, adversarial epistemology 14->12, against causal inference 6->7 and value of information 8->9. CONCLUSION: the extra 9.73 GiB of weights bought no measurable quality on this suite while costing decode speed and 9.73 GiB of headroom. Treat the negative deltas as absence-of-gain rather than proof of regression, since these are single deterministic runs and the README rates keyword-rubric totals as directional only. On this evidence 35b-a3b-q5 remains the better default and this entry is retained as a measured reference point."
