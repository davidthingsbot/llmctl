DESC="Qwen3.6-27B dense-FFN/hybrid-attn Q8_0 GGUF, llama.cpp, 256K (full native)"
NOTES="Validated 2026-08-04 on llama.cpp b10276 / Vulkan gfx1150. Dense Q8_0 GGUF is 26.63 GiB and starts in 66-70 s at one 131,072-token slot with Q8 KV. Observed GPU allocation was 31.04 GiB. Controlled cold-prefix C1 result was 111.14 tok/s prefill, 2.95 tok/s generation, 2.03 tok/s end-to-end aggregate and 49.20 s for 1,585 prompt plus 100 generated tokens. Testing ubatch 2048 did not improve the llmctl startup benchmark (104.4 versus 105.1 tok/s prefill) and consumed about 0.86 GiB more VRAM, so final ubatch is 512 with batch 2048 and a 2 GiB prompt-cache cap. This model is approximately seven times slower at generation than the 35B-A3B and is retained as a dense-reference/validation option, not the interactive default. Work-quality-v1 on 2026-08-05: 87/100 in 937.11 s; full credit on strict protocol JSON, BOM consolidation, executable frame-decoder repair, 35K-token retrieval and scope control; 10/12 C review, 12/18 open protocol architecture and 1/6 arithmetic. Quality is close to 35B on this small suite, but wall time was 4.29 times longer. Deep-reasoning-v1 on 2026-08-05: 71/100 in 728.25 s; perfect hypothesis discrimination, adversarial epistemology and Wason selection, but failed the unique logic grid and second Bayesian update. The two-point lead over 35B does not offset a 7.40-times longer reasoning-suite wall time. Three-judge blind review of the two open responses averaged 18.17/20, rank 1, but the speed penalty still prevents an interactive recommendation. RAISED 128K -> 256K ON 2026-08-11 after direct measurement. THIS MODEL IS NOT DENSE-ATTENTION despite the 'dense' label, which means dense-FFN (not MoE) only: the GGUF declares qwen35.full_attention_interval=4 plus SSM keys (ssm.state_size 128, ssm.conv_kernel 4, ssm.group_count 16, ssm.inner_size 6144), so only 16 of 64 layers carry KV. Measured KV is ~35 KiB/token at q8_0, NOT the ~128 KiB/token that block_count x (key_length+value_length) x head_count_kv predicts if you assume every layer attends — a 4x overestimate that wrongly makes long context look unaffordable. Measured allocation: 30.18 GiB at 131,072 and 34.56 GiB at 262,144 (delta 4.38 GiB per 128K tokens), both at q8_0 KV, so the full 262,144 native window fits 48 GiB with 13.4 GiB headroom and needs no q4_0 downgrade. Loads in 70 s at 256K and a live completion at that config returned correct output. 262,144 is the architectural ceiling (qwen35.context_length), so no amount of extra RAM buys this model more context. Also clears the Hermes Agent 64,000-token floor by 4x, making it a viable agent brain if 2.9 tok/s generation is acceptable."
