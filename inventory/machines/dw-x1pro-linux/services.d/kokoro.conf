KIND=kokoro
PORT=19460
IMAGE="ghcr.io/remsky/kokoro-fastapi-cpu:latest"
HOST=127.0.0.1
DESC="Kokoro-82M TTS, CPU, OpenAI-compatible /v1/audio/speech"
NOTES="Kokoro-82M served by kokoro-fastapi, registered 2026-09-23. DOCKER, AND THAT IS THE DIVERGENCE FROM THE OTHER TWO BOXES: docker 29.4.0 runs here without sudo, so the image (4.95 GB) supplies espeak-ng and there is no reason for the PYTHON=+APP_DIR= native path DW-AMD-LINUX needed. CPU only, and not a tuning gap: onnxruntime has no Vulkan EP and no usable ROCm wheel, so there is no GPU path for this model on a gfx1150 APU at all — irrelevant at 82M params. The container listens on 8880 internally and llmctl maps it to PORT. BOUND TO 127.0.0.1, NOT 0.0.0.0 like dw-bee and DW-AMD-LINUX: kokoro-fastapi has no API key option, ufw state here is unverifiable without passwordless sudo, and nothing on the LAN is known to consume this box's speech yet — widen HOST deliberately, together with a ufw rule scoped to 192.168.1.0/24, if a client ever needs it. Output is 24 kHz mono WAV; /v1/audio/voices lists 72 voices with quality grades. MEASURED 2026-09-23 with the whisper service up and 35b-a3b-q5 resident: 80.29 s of af_bella audio rendered in 11.64 s = 6.9x realtime, a short 6.46 s clip in 1.08 s = 6.0x, first request 0.32 s warm-up. That is dw-bee territory (6.2x) and far off DW-AMD-LINUX's 15x on the 9950X3D — this is a 12C/24T mobile part and TTS here is pure CPU. WATCH THE RAM, NOT THE VRAM: the container holds 1.293 GiB of the 15.23 GiB CPU-visible RAM (the 48 GiB is fixed VRAM and unavailable to it), which is the scarce resource on this box — with the 35B up, free showed ~5 GiB available. Verified end to end against the whisper service on 19450: whisper transcribed this service's output back verbatim."
HEALTH_PATH=/health
HEALTH_TIMEOUT=300
