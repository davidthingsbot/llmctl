KIND=kokoro
PORT=19460
IMAGE="ghcr.io/remsky/kokoro-fastapi-cpu:latest"
HOST=0.0.0.0
DESC="Kokoro-82M TTS, CPU, OpenAI-compatible /v1/audio/speech"
NOTES="Kokoro-82M served by kokoro-fastapi, registered 2026-09-23. DOCKER, AND THAT IS THE DIVERGENCE FROM THE OTHER TWO BOXES: docker 29.4.0 runs here without sudo, so the image (4.95 GB) supplies espeak-ng and there is no reason for the PYTHON=+APP_DIR= native path DW-AMD-LINUX needed. CPU only, and not a tuning gap: onnxruntime has no Vulkan EP and no usable ROCm wheel, so there is no GPU path for this model on a gfx1150 APU at all — irrelevant at 82M params. The container listens on 8880 internally and llmctl maps it to PORT. BOUND TO 0.0.0.0 FOR THE LAN, matching dw-bee and DW-AMD-LINUX — switched 2026-09-23 from the 127.0.0.1 it was first registered with. kokoro-fastapi has no API key option, so anything that can route to 19460 can synthesize speech and spend CPU, and the firewall is the only thing limiting that: ufw is installed but `sudo ufw status verbose` needs a password here, so verify 19460 by hand. NOTE 19460 falls OUTSIDE the 19438:19443 range the other boxes' ufw rules cover, and this box carries a tailscale0 interface (100.67.207.11), so 0.0.0.0 publishes it to the tailnet as well as the wired LAN — a rule scoped to 192.168.1.0/24 does not cover the tailnet path. Docker publishes the mapped port with its own iptables chain (DOCKER-USER), which ufw's default INPUT rules do NOT filter, so for this service the ufw check is necessary but not sufficient. Output is 24 kHz mono WAV; /v1/audio/voices lists 72 voices with quality grades. MEASURED 2026-09-23 with the whisper service up and 35b-a3b-q5 resident: 80.29 s of af_bella audio rendered in 11.64 s = 6.9x realtime, a short 6.46 s clip in 1.08 s = 6.0x, first request 0.32 s warm-up. That is dw-bee territory (6.2x) and far off DW-AMD-LINUX's 15x on the 9950X3D — this is a 12C/24T mobile part and TTS here is pure CPU. WATCH THE RAM, NOT THE VRAM: the container holds 1.293 GiB of the 15.23 GiB CPU-visible RAM (the 48 GiB is fixed VRAM and unavailable to it), which is the scarce resource on this box — with the 35B up, free showed ~5 GiB available. Verified end to end against the whisper service on 19450: whisper transcribed this service's output back verbatim."
HEALTH_PATH=/health
HEALTH_TIMEOUT=300
