NOTES="whisper.cpp a664346e (master, 2026-09-23 — the SAME commit DW-AMD-LINUX built, so the Vulkan and CUDA numbers compare directly) built at /home/david/work/whisper.cpp/build-vk: Release + GGML_VULKAN + GGML_NATIVE + GGML_OPENMP, gcc 13.3, the same toolchain as the llama.cpp build-vk. THE SPIRV-Headers TRAP BITES HERE TOO, AND IN ITS SUBTLER FORM: configure SUCCEEDS and prints 'Vulkan found' + GL_KHR_cooperative_matrix, then the ggml-vulkan.cpp compile dies with 'spv has not been declared' because find_package(SPIRV-Headers) never propagates its include directory. -DCMAKE_PREFIX_PATH and -DSPIRV-Headers_DIR are NOT sufficient on their own; the build only completes with CPLUS_INCLUDE_PATH=/home/david/.local/opt/spirv-headers-1.4.309.0/usr/include exported into the build. Note this box vendors SPIRV-Headers at ~/.local/opt/spirv-headers-1.4.309.0, NOT at dw-bee's ~/work/.local-deps — same trap, different prefix. Build dir is build-vk (not versioned like DW-AMD-LINUX's build-cuda-a664346e); do not rename it, CMake caches absolute paths. Model is the same ggml-large-v3-turbo-q5_0 (573.40 MB) as both other boxes. ROUTE: --request-path /v1 --inference-path /audio/transcriptions puts it on the OpenAI audio route (POST /v1/audio/transcriptions, health at /v1/health; the native /inference is gone), following the one-speech-interface decision of 2026-09-23 so clients use one dialect for this and for kokoro on 19460. BOUND TO 127.0.0.1, NOT 0.0.0.0 like dw-bee and DW-AMD-LINUX: whisper-server has no API key option of any kind, ufw state here is unverifiable without passwordless sudo, and nothing on the LAN is known to consume this box's speech yet — widen HOST deliberately, with a ufw rule scoped to 192.168.1.0/24, if a client ever needs it. --convert is on so clients can post mp3/ogg/flac (ffmpeg is installed). Device comes up as RADV GFX1150 with uma=1, fp16=1, warp size 64 and KHR_coopmat matrix cores, i.e. real coopmat rather than a scalar fallback (bf16=0, int dot=0, unlike the Zen 4 box's build flags). 573.40 MB of weights on Vulkan0 plus 233.07 MB of compute buffers (conv 37.69 + encode 55.35 + cross 39.99 + decode 100.04); measured VRAM delta ~864 MB against the 48 GiB, host RSS only 221 MB (dw-bee: 223 MB). MEASURED 2026-09-23 WITH 35b-a3b-q5 RESIDENT AND SERVING, so these are contended numbers: whisper-bench encoder 542.43 ms per 30 s window, decode 3.51 ms/token, prompt 0.09 ms, batchd 0.81 ms; an 80.29 s clip transcribed via the service in 3.69 s = 21.8x realtime (dw-bee: 16.3x). THIS REPRODUCES THE dw-bee THESIS ON DIFFERENT SILICON RATHER THAN JUST BENEFITING FROM IT: against dw-bee's 780M the encoder is 1.30x faster (542 vs 704 ms) but decode is 3.51 vs 3.38 ms, i.e. no better at all and marginally worse, because generation is bandwidth-bound and this part has ~77 GiB/s of shared LPDDR5 to feed both the graphics core and the CPU. The RTX 5080 on DW-AMD-LINUX encodes in 28.7 ms, 18.9x faster than here — discrete VRAM is a different class of machine for this workload, and whisper is encoder-dominated, so that gap is the whole story for STT. Verified end to end against the kokoro service on 19460: kokoro rendered a two-clause sentence and whisper transcribed it back verbatim."
