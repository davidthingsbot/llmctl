DESC="Qwen3.5-9B Q4_K_M + F16 mmproj (vision), llama.cpp, Vulkan 780M, thinking off"
NOTES="Dense 9B at Q4_K_M, fully offloaded to the Radeon 780M over Vulkan. ACCEL=cpu on this box because there is no CUDA or ROCm runtime, so llmctl adds no -ngl of its own and EXTRA_ARGS does the offload explicitly with -ngl 99. Served at SERVER_CTX 65536. Hand-written on 2026-07-11 rather than generated by the add wizard. QUANT, read from the GGUF header 2026-09-22: the Q4_K_M label understates it — the actual tensor mix is Q4_K 64.34%, Q6_K 22.09%, Q5_K 8.99%, Q8_0 4.57%, for 5.21 bits per weight effective, because _M promotes attention and output tensors. It is an INTEGER k-quant, not FP4 or FP8: k-quants store 4/5/6-bit integers in super-blocks with an f16 scale and min, which is a different thing from the floating-point microformats vLLM and TensorRT use on NVIDIA silicon. The only genuine FP4 on this machine is gpt-oss-20b, 91.37% MXFP4. MEASURED 2026-09-22 on the b10276 Vulkan build: load 6s, prefill 245.2 tok/s, generation 15.7 tok/s at GPU 85% and 43W — against the 35B incumbent's 169/11, i.e. ~45% faster prefill and ~43% faster generation, which is what full offload buys over the 35B's 30-of-40-layer split. Resident footprint is small enough that system memory goes from 20 GiB used to 12 GiB and swap frees ~900 MiB when this model replaces the 35B. THINKING LOOPS ON TRIVIAL PROMPTS, AND THIS IS WHY --chat-template-kwargs IS SET. Asked merely to echo a short string, it hallucinated a conversation history and enumerated it without terminating — 'Turn 50 (Model)... Turn 51 (User)... Turn 52 (Model)...' — running to a 1200-token cap with reasoning_content full and content empty, so finish_reason is length and the caller gets nothing. It is not a server fault and not the same as the gpt-oss budget trap, where reasoning merely crowded out a short answer: this is a genuine degenerate loop that more budget does not fix. With enable_thinking false the same prompt answers in 6 tokens. Thinking is otherwise sound on substantive work — given the 17.59 GiB heap versus 16.6 GiB weights plus 2.5 GiB KV question it answered correctly ('No, 19.1 GiB exceeds 17.59'), which is the same question gpt-oss-20b got wrong — but it spent 1377 tokens to do it where the 35B needed 514. THE SERVER-SIDE SETTING IS A DEFAULT, NOT A LOCK — VERIFIED 2026-09-22, and note this differs from gpt-oss-20b, whose NOTES record that a request-level kwarg does NOT override the server-side reasoning_effort. For enable_thinking on this model it DOES: a request carrying chat_template_kwargs {"enable_thinking": true} brings thinking back (2556 chars of reasoning, and the trivial-prompt loop with it). So the conf sets the default and callers opt in per request when they want reasoning. COST OF TURNING THINKING OFF, AND IT IS NOT FREE: on the 17.59 GiB heap question the thinking-off answer is WRONG and self-contradictory — it computed 16.6 + 2.5 = 19.1 GiB, stated that this exceeds the budget, and then concluded 'Yes, the server fits'. With thinking on the same model answers correctly. Treat thinking-off as the mode for instruction-following, extraction and short factual replies, and pass enable_thinking true for anything requiring arithmetic or multi-step judgement — accepting that a too-trivial prompt may then loop. VISION ADDED 2026-09-22 via mmproj-Qwen3.5-9B-F16.gguf (918166080 bytes, 0.855 GiB) from unsloth/Qwen3.5-9B-GGUF. The projector is a separate file: the base weights are the SAME Qwen_Qwen3.5-9B-Q4_K_M.gguf this model already served, so vision cost 0.86 GiB of heap and required no new base model and no eviction of the speech services — the same arrangement DW-AMD-LINUX records in its qwen9b-vl.conf, where this pairing scored 218/438 work and 157/302 reasoning in the audition battery. Budget context at the time: 8.18 of 17.59 GiB heap in use with whisper idle, 9.41 GiB free, so the projector consumed under a tenth of the spare heap. Note the heap, not MemTotal, is the binding limit on this box; going headless would free system RAM but NOT heap, since GTT is pinned at 50 percent of MemTotal — raising the ceiling needs amdgpu.gttsize on the kernel cmdline. MEASURED COST: heap went 8.18 -> 9.28 GiB of 17.59, i.e. 1.10 GiB for the 0.855 GiB projector plus its buffers, leaving 8.31 GiB free with whisper and kokoro untouched and still healthy. VERIFIED on a synthetic image with known ground truth: it read a serial (4B7Q-2291), counted 3 blue circles and 2 red squares, and returned the status line, all correct, in 57 tokens with thinking off. GROUNDING CAVEAT, straight from llama.cpp at load: 'Qwen-VL models require at minimum 1024 image tokens to function correctly on grounding tasks - if you encounter problems with accuracy, try adding --image-min-tokens 1024'. Plain reading and counting work without it, as above; add that flag to EXTRA_ARGS if bounding boxes or spatial grounding are needed, at the cost of more image tokens per request."
