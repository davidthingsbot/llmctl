NOTES="OpenAI gpt-oss-20b, MoE 21B total / 3.6B active, 24 layers alternating sliding-window (128) and full attention, 32 experts top-4, arch=gpt-oss (supported by both the March build and b10276). Chosen as the size-down candidate because it is the only model in its class that fits the 17.59 GiB Vulkan heap WHOLE: the MoE weights are natively MXFP4 and barely re-quantize, so every quant from Q2_K to Q8_0 lands between 10.68 and 11.27 GiB — Q8_0 is taken because there is no reason to take less. Only the 12 full-attention layers carry real KV, at 8 kv-heads x 64 head_dim = 24 KiB/token, so 131072 context costs just 3.00 GiB at f16. Budget: 11.27 weights + 3.00 KV + ~1.0 compute = ~15.3 GiB of 17.59, leaving ~2.3 GiB spare — hence -ngl 99 full offload at maximum context with f16 KV, no q8_0 KV and no -ngl tuning needed. Contrast the incumbent qwen35b, which at 16.59 GiB cannot fully offload at any useful context. Downloaded 2026-08-29 from unsloth/gpt-oss-20b-GGUF; size verified at exactly 12,109,567,168 bytes. MEASURED on the b10276 Vulkan build: prefill 341-345 tok/s, generation 25.4-28.2 tok/s, 14.18 GiB resident on the GPU with nothing spilled to CPU — against the incumbent qwen35b's 179/10.5 at -ngl 30. That is ~2x prefill and ~2.5x generation, and it is the whole point of the model: it is the only candidate in its class that fits the heap whole. Nemotron-3-Nano-30B-A3B at IQ4_XS is 16.92 GiB and GLM-4.7-Flash at Q4 ~17-18 GiB, both landing back in partial offload, i.e. lateral moves. REASONING BUDGET TRAP, and the reason for the EXTRA_ARGS above: gpt-oss ALWAYS emits a harmony analysis channel. There is no off switch — '--reasoning off' is a no-op (it controls extraction, not generation) and chat_template_kwargs reasoning_effort 'none' behaves identically to 'low'. Server-side --chat-template-kwargs '{"reasoning_effort":"low"}' halves the overhead (26 vs 61 tokens on a trivial prompt) and is NOT overridden by a request-level enable_thinking kwarg, so the eval suites run unmodified. Even so the suites cannot score this model: their per-task max_tokens are sized for thinking-disabled models, reasoning consumes the budget, and the answer is never written. The recorded 66/100 and 55/100 are ARTIFACTS. Re-run per task at budget 1500: long_context_retrieval 0/16 -> 16/16 using 311 tokens against a 220 budget, value_of_information 0/12 -> 9/12 using 449 against 340, bayesian_reasoning 0/12 -> 8/12 using 309 against 280. acquisition_timing's HTTP 500 is the same cause — truncation mid-channel makes llama.cpp's harmony parser reject the output with 'does not match the expected peg-native format'. Corrected totals are roughly 82/100 work and 72/100 reasoning against qwen35b's 85/71, but these are stitched from per-task reruns and are NOT a recorded single pass. VERDICT — NOT ADOPTED AS DEFAULT. Two real tasks from this repo exposed what the rubric could not. Asked whether a 16.59 GiB model fits a 17.59 GiB heap at 131072 context, it inverted the meaning of -ngl, omitted the weights from the GPU budget entirely, concluded 3.50 GiB and answered YES to both questions — recommending in production the exact -ngl 38 setting that cannot fit. It invented a supporting mechanism about streaming 16.6 GiB of weights per forward pass. On a bash credential-guard review it found two real gaps (bearer, private_key, and user:pass with no @) but claimed access_token, client_secret, api-key-file and password_file were all missed when the regex catches every one, and hallucinated a syntax error in a function that was merely truncated in the prompt. Keep it for bounded checkable work — it scored 20/20 on executable code repair and 16/16 on retrieval — and keep qwen35b for anything needing unsupervised engineering judgement."
