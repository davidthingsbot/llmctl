NOTES="Hybrid MoE: 40 layers of which only 10 carry attention/KV, so 128k KV is just ~2.5 GiB at f16 and the whole model fits at 128k. Measured resident with -ngl 30: 3.83 GiB in carved-out iGPU VRAM plus 11.52 GiB of GTT, so the GPU side consumes only ~11.5 GiB of the 27.18 GiB MemTotal. -ngl 99 does not work here — the 16.6 GiB of weights alone nearly fill the ~18 GiB Vulkan heap, leaving no room for KV and compute, which thrashes GTT and wedges the server. -ngl 30 offloads 30/40 layers, ~14.8 GiB on the iGPU and ~5.7 GiB on the CPU. On this unified-memory APU the split is a prefill play, not a bandwidth play: GPU and CPU share one DDR5 bus, so offload does not speed generation (the handoff actually costs ~1 tok/s against pure CPU) but it speeds compute-bound prefill ~1.5x, which is what dominates latency past 100k context. Measured at 128k: prefill 190 tok/s, generation ~9 tok/s."
