KIND=kokoro
PORT=19443
IMAGE="ghcr.io/remsky/kokoro-fastapi-cpu:latest"
HOST=0.0.0.0
DESC="Kokoro-82M TTS, CPU, OpenAI-compatible /v1/audio/speech"
NOTES="Kokoro-82M served by kokoro-fastapi, registered 2026-09-22. CPU ONLY, AND THAT IS NOT A TUNING GAP: onnxruntime has no Vulkan execution provider, no usable ROCm wheel, and DirectML is Windows-only, so there is no GPU path for this model on this box at all. It does not matter at 82M parameters — MEASURED 0.98 s to render 6.03 s of audio, i.e. 6.2x realtime on the 8C/16T Zen 4 part, with the 35B resident and whisper also up. Docker rather than a venv because the image bakes in espeak-ng, which Kokoro's phonemizer needs and which is NOT installed on this machine; there is no passwordless sudo here to install it, and the pip espeakng-loader route would be the alternative if the container is ever dropped. The container listens on 8880 internally and llmctl maps it to PORT. NO AUTHENTICATION: kokoro-fastapi has no API key option, so anything that can route to 19443 can synthesize speech and spend CPU; the ufw rule restricting 19438:19443 to 192.168.1.0/24 is the only access control on this port — do not widen it. Verified end to end as part of an STT to LLM to TTS round trip: whisper transcribes, qwen35b answers, kokoro speaks the answer. Voice af_bella used in that test; /v1/audio/voices lists the full set with quality grades."
HEALTH_PATH=/health
HEALTH_TIMEOUT=300
