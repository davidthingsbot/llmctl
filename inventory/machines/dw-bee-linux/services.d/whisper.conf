DESC="whisper large-v3-turbo q5_0, llama.cpp Vulkan 780M, 16.3x realtime"
NOTES="whisper.cpp 1.9.4 (ggml 0.24.0, commit a44e078) built 2026-09-22 at /home/david/work/whisper.cpp/build-vk — Release + Vulkan + GGML_NATIVE + OpenMP under gcc 13.3, the same toolchain as the llama.cpp build-vk. BUILD TRAP, WORSE THAN THE llama.cpp CASE: machine.conf records that find_package(SPIRV-Headers CONFIG REQUIRED) succeeds but fails to propagate its include directory. In whisper.cpp it fails outright at the find_package line — the vendored copy is not on the default search path at all — so CPLUS_INCLUDE_PATH alone is NOT enough and -DCMAKE_PREFIX_PATH=/home/david/work/.local-deps is also required. Device comes up as RADV PHOENIX with uma=1, fp16=1 and KHR_coopmat matrix cores, i.e. real coopmat rather than a scalar fallback. MODEL CHOICE IS BOUNDED BY THE HEAP, NOT BY QUALITY: qwen35b holds 15.35 GiB of the 17.59 GiB Vulkan heap, leaving ~2.2 GiB. large-v3-turbo at q5_0 is 573.40 MB of weights plus 233 MB of compute buffers (conv 37.69 + encode 55.35 + cross 39.99 + decode 100.04) = ~807 MB, so it co-resides with the 35B and still leaves ~1.4 GiB spare; host RSS is only 223 MB. Unquantized large-v3 (3.1 GiB) does not fit while a model is up, and the 780M is reported to hang on the unquantized medium model regardless — stay quantized here. MEASURED 2026-09-22 on 308 s of audio WITH qwen35b resident and serving, so these are contended numbers and a clean-heap run would be slightly better: Vulkan 18.9 s wall = 16.3x realtime, CPU 8 threads 134.1 s wall = 2.3x realtime, 7.1x end-to-end. Encoder bench per 30 s window: Vulkan 704 ms, CPU 8t 6880 ms, CPU 16t 7261 ms. THE WIN IS ENTIRELY IN THE ENCODER and this confirms the machine.conf thesis rather than merely benefiting from it: encode 727 vs 6817 ms is 9.4x, prompt 0.15 vs 1.04 ms is 6.9x, but decode is 3.38 vs 3.70 ms — only 1.1x, because decode is bandwidth-bound and GPU and CPU share the one DDR5 bus. Whisper is encoder-dominated (fixed 30 s windows of batch matmul, structurally prefill-shaped) so it sits almost entirely on the favorable side of that split, which is the opposite of the 35B whose bulk is generation. Note 16 threads is SLOWER than 8 on CPU, the same SMT contention the llama.cpp -ngl tuning ran into; the CPU baseline is not weak either, since this Zen 4 part has AVX512 with VNNI and BF16 all active in the build. NO AUTHENTICATION: whisper-server has no API key option of any kind, unlike llama.cpp and vLLM which llmctl always key-protects, so the ufw rule restricting 19438:19443 to 192.168.1.0/24 is the only access control on this port. --convert is enabled so clients can post mp3/ogg/flac (ffmpeg transcodes to WAV); verified working on both WAV and MP3 via POST to /inference."
HEALTH_PATH=/health
HEALTH_TIMEOUT=120
EXTRA_ARGS="-l auto"
