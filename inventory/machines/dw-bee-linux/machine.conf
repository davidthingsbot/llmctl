MACHINE_NAME="dw-bee-linux"
NOTES="AMD Ryzen 7 255 with Radeon 780M (Phoenix3) iGPU, 8C/16T; 32 GB physical DDR5. The firmware carves 4.00 GiB out below the OS as dedicated iGPU VRAM, leaving MemTotal 27.18 GiB; the amdgpu GTT aperture is a further 13.59 GiB — exactly half of MemTotal — drawn from that 27.18 GiB. So the Vulkan heap llama.cpp reports (18015 MiB) is 4.00 GiB VRAM + 13.59 GiB GTT = 17.59 GiB, and only the GTT half competes with CPU RAM: offloading to this iGPU does not free system memory beyond the first 4 GiB. Measured with qwen35b at -ngl 30 resident: 3.83 GiB VRAM + 11.52 GiB GTT = 15.35 GiB on the GPU, of which only the 11.52 GiB counts against MemTotal. Plus 8 GiB swap, on a 915 GB NVMe root with ~420 GB free — disk is not a constraint here. Ubuntu 24.04.4 LTS, kernel 7.0.0-28-generic. Neither ROCm nor CUDA is installed, so ACCEL=cpu and VRAM_PER_GPU_MB=0; all offload is llama.cpp Vulkan (RADV PHOENIX, uma=1, coopmat) driven by per-model -ngl in EXTRA_ARGS rather than by llmctl. llama-server is the system-wide /usr/local/bin build 451ef08 dated 2026-03-08 and is well behind the b10276 used on dw-x1pro-linux. History: before llmctl this box served models with Ollama as a system service (/etc/systemd/system/ollama.service, user ollama) running qwen3.5:35b-a3b-q4_K_M and qwen3.5:9b out of a 29 GiB blob store under /usr/share/ollama; llmctl took over on 2026-07-11 with standalone GGUFs in ~/models on ports 19438/19439, and ollama.service is now disabled and dead though its blobs remain on disk. VLLM_BIN is an unedited default — there is no vLLM venv here — and WEBUI_ENABLE=1 has never been exercised, as the open-webui container has never been created."
ACCEL=cpu
GPUS_DEFAULT=""
TENSOR_PARALLEL_DEFAULT=1
VRAM_PER_GPU_MB=0
VLLM_BIN="/home/david/.venvs/vllm/bin/vllm"
LLAMA_SERVER="/usr/local/bin/llama-server"
MODELS_DIR="/home/david/models"
WIZARD_BASE_PORT=19438
ENABLE_BUILTIN_MODELS=0
WEBUI_ENABLE=1
WEBUI_CONTAINER="open-webui"
WEBUI_PORT=8088
WEBUI_IMAGE="ghcr.io/open-webui/open-webui:main"
LEGACY_UNITS=""
