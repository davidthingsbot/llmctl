MACHINE_NAME="dw-bee-linux"
NOTES="AMD Ryzen 7 255 with Radeon 780M (Phoenix3) iGPU, 8C/16T; 32 GB physical DDR5. The firmware carves 4.00 GiB out below the OS as dedicated iGPU VRAM, leaving MemTotal 27.18 GiB; the amdgpu GTT aperture is a further 13.59 GiB — exactly half of MemTotal — drawn from that 27.18 GiB. So the Vulkan heap llama.cpp reports (18015 MiB) is 4.00 GiB VRAM + 13.59 GiB GTT = 17.59 GiB, and only the GTT half competes with CPU RAM: offloading to this iGPU does not free system memory beyond the first 4 GiB. Measured with qwen35b at -ngl 30 resident: 3.83 GiB VRAM + 11.52 GiB GTT = 15.35 GiB on the GPU, of which only the 11.52 GiB counts against MemTotal. Plus 8 GiB swap, on a 915 GB NVMe root with ~420 GB free — disk is not a constraint here. Ubuntu 24.04.4 LTS, kernel 7.0.0-28-generic. Neither ROCm nor CUDA is installed, so ACCEL=cpu and VRAM_PER_GPU_MB=0; all offload is llama.cpp Vulkan (RADV PHOENIX, uma=1, coopmat) driven by per-model -ngl in EXTRA_ARGS rather than by llmctl. llama.cpp REBUILT 2026-08-29 from the March build 451ef08 to b10276 / commit 6ea215d171fd31df943bf1ac8227129f2b963160 — the exact commit dw-x1pro-linux validated — Release + Vulkan + GGML_NATIVE + OpenMP 4.5 under gcc 13.3, at /home/david/work/llama.cpp/build-vk. 16617/16617 Vulkan backend tests passed, matching x1pro's figure exactly; the root-owned March install under /usr/local is left in place as a fallback. BUILD TRAP: find_package(SPIRV-Headers CONFIG REQUIRED) succeeds but never propagates its include directory, so ggml-vulkan.cpp fails with 36 "'spv' has not been declared" errors on any box without distro spirv headers in /usr/include. There is no passwordless sudo here, so SPIRV-Headers vulkan-sdk-1.4.309.0 is vendored at /home/david/work/.local-deps and the build needs CPLUS_INCLUDE_PATH pointing at its include dir; 'sudo apt install spirv-headers' is the tidier fix if root is available. MEASURED GAIN on the incumbent qwen35b, same model and settings: at -ngl 30 the new build gives pp2048 171.3 and tg128 13.1 against the old build's 197.6 and 8.9 — generation +48%, prefill -13%. That prefill loss is NOT a regression, it is a stale tuning: a -ngl sweep on the new build rises monotonically on BOTH axes (ngl 0: 66.1/8.6, 20: 132.8/11.1, 30: 170.9/13.1, 36: 214.3/17.9, 38: 230.1/19.0), so at -ngl 38 the new build beats the old on prefill AND more than doubles generation. CAUTION, AND THE REASON -ngl 30 IS STILL SHIPPED: that sweep ran at pp2048 where KV is negligible. At the production 131072 context KV costs 2.5 GiB, so 38 of 40 layers plus KV plus compute needs ~18.3 GiB against a 17.59 GiB heap and will not fit. Re-tune -ngl at real context, never at benchmark context. History: before llmctl this box served models with Ollama as a system service (/etc/systemd/system/ollama.service, user ollama) running qwen3.5:35b-a3b-q4_K_M and qwen3.5:9b out of a 29 GiB blob store under /usr/share/ollama; llmctl took over on 2026-07-11 with standalone GGUFs in ~/models on ports 19438/19439, and ollama.service is now disabled and dead though its blobs remain on disk. VLLM_BIN is an unedited default — there is no vLLM venv here — and WEBUI_ENABLE=1 has never been exercised, as the open-webui container has never been created."
ACCEL=cpu
GPUS_DEFAULT=""
TENSOR_PARALLEL_DEFAULT=1
VRAM_PER_GPU_MB=0
VLLM_BIN="/home/david/.venvs/vllm/bin/vllm"
LLAMA_SERVER="/home/david/work/llama.cpp/build-vk/bin/llama-server"
MODELS_DIR="/home/david/models"
WIZARD_BASE_PORT=19438
ENABLE_BUILTIN_MODELS=0
WEBUI_ENABLE=1
WEBUI_CONTAINER="open-webui"
WEBUI_PORT=8088
WEBUI_IMAGE="ghcr.io/open-webui/open-webui:main"
LEGACY_UNITS=""
