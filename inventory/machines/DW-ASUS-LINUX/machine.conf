MACHINE_NAME="DW-ASUS-LINUX"
NOTES="Dual RTX 3090 (24GB each, 48GB total), 62GB quad-channel DDR3, i7-4930K (6c/12t, AVX only — no AVX2/FMA, which halves llama.cpp CPU-expert throughput). PCIe 3.0 x16, so vLLM weight-offload (~15.75GB/s over the bus) is slower than llama.cpp computing experts in place at RAM bandwidth (~35-40GB/s). GPU0 also drives the desktop, so leave 1-2GB VRAM headroom there; slot 1 runs ~10C hotter than slot 2 regardless of card. Both cards capped at 300W. llama.cpp UPGRADED b8189 -> b10270 on 2026-08-04 (+2080 commits), rebuilt in place at /home/david/work/llama.cpp/build; rollback binaries in build/bin/rollback-b8189/ and 'git checkout b8189'. The upgrade alone roughly DOUBLED generation on existing models (coder-next 52 -> 118 tok/s unoffloaded). It also added arch 'deepseek4' (and 'deepseek32'), without which DeepSeek-V4-Flash cannot load at all. UNIVERSAL RULES learned across all local models: (1) -fit off is required whenever --n-cpu-moe or an explicit --tensor-split is used, because llama_params_fit refuses configs that actually fit merely to reserve 1024MiB/card; (2) --tensor-split must be given manually and RE-BISECTED after any --n-cpu-moe change, since offload makes the first N layers light and an even split then overloads the second GPU; (3) -ctk q8_0 -ctv q8_0 roughly halves KV, validated for quality at 120K depth; (4) --no-mmap is ESSENTIAL when the model exceeds RAM — with mmap the kernel treats CPU-resident expert weights as evictable page cache and re-reads them from disk every token (DeepSeek 284B: 1.48 -> 6.39 tok/s, 4.3x, from --no-mmap alone). READINESS DETECTION on b10270: /health returns 200 while the model is still loading — poll /props and wait for a non-503, and note the log no longer prints 'main loop' (it prints 'model loaded'/'listening on') and -lv LOWERS verbosity below the default 3. Long loads need setsid, not nohup: a tool/shell timeout SIGTERMs the whole process group and silently kills a nohup'd load."
ACCEL=cuda
GPUS_DEFAULT="0,1"
TENSOR_PARALLEL_DEFAULT=2
VRAM_PER_GPU_MB=24576
VLLM_BIN="/home/david/.venvs/vllm/bin/vllm"
LLAMA_SERVER="/home/david/work/llama.cpp/build/bin/llama-server"
MODELS_DIR="/home/david/models"
WIZARD_BASE_PORT=19438
ENABLE_BUILTIN_MODELS=1
HERMES_ENABLE=1
OPENCLAW_ENABLE=1
WEBUI_ENABLE=1
