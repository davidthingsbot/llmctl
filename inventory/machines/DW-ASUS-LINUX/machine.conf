MACHINE_NAME="DW-ASUS-LINUX"
NOTES="Dual RTX 3090 (24GB each, 48GB total), 62GB quad-channel DDR3, i7-4930K (6c/12t, AVX only — no AVX2/FMA, which halves llama.cpp CPU-expert throughput). PCIe 3.0 x16, so vLLM weight-offload (~15.75GB/s over the bus) is slower than llama.cpp computing experts in place at RAM bandwidth (~35-40GB/s). GPU0 also drives the desktop, so leave 1-2GB VRAM headroom there; slot 1 runs ~10C hotter than slot 2 regardless of card. Both cards capped at 300W. llama.cpp UPGRADED b8189 -> b10270 on 2026-08-04 (+2080 commits), rebuilt in place at /home/david/work/llama.cpp/build; rollback binaries in build/bin/rollback-b8189/ and 'git checkout b8189'. The upgrade alone roughly DOUBLED generation on existing models (coder-next 52 -> 118 tok/s unoffloaded). It also added arch 'deepseek4' (and 'deepseek32'), without which DeepSeek-V4-Flash cannot load at all. UNIVERSAL RULES learned across all local models: (1) -fit off is required whenever --n-cpu-moe or an explicit --tensor-split is used, because llama_params_fit refuses configs that actually fit merely to reserve 1024MiB/card; (2) --tensor-split must be given manually and RE-BISECTED after any --n-cpu-moe change, since offload makes the first N layers light and an even split then overloads the second GPU; (3) -ctk q8_0 -ctv q8_0 roughly halves KV, validated for quality at 120K depth; (4) --no-mmap is ESSENTIAL when the model exceeds RAM — with mmap the kernel treats CPU-resident expert weights as evictable page cache and re-reads them from disk every token (DeepSeek 284B: 1.48 -> 6.39 tok/s, 4.3x, from --no-mmap alone). READINESS DETECTION on b10270: /health returns 200 while the model is still loading — poll /props and wait for a non-503, and note the log no longer prints 'main loop' (it prints 'model loaded'/'listening on') and -lv LOWERS verbosity below the default 3. Long loads need setsid, not nohup: a tool/shell timeout SIGTERMs the whole process group and silently kills a nohup'd load. vLLM (still 0.23.0, NOT upgraded — only llama.cpp was) RULES learned 2026-08-04: (a) --max-num-batched-tokens must exceed the Mamba-aligned attention block size on hybrid Qwen models — the default 2048 sits just under the 2096 block and the engine asserts 'In Mamba cache align mode, block_size must be <= max_num_batched_tokens'; use 4096. This failure looks unrelated to whatever you changed and is probably why these recipes sat at conservative settings. (b) vLLM refuses to start unless ONE full-length request fits, printing the exact byte comparison — useful for sizing. (c) --kv-cache-memory-bytes overrides --gpu-memory-utilization entirely; a BIGGER KV pool measured FASTER (622.9 -> 666.9 tok/s at 8 concurrent) because fewer preemptions, so there is no capacity/throughput tradeoff, only a memory-safety one. (d) Testing vLLM outside llmctl requires replicating the recipe's ENVIRONMENT, not just its flags: PATH must include the venv bin or torch.compile fails with \"No such file or directory: 'ninja'\". (e) ENGINE CHOICE: on the identical Qwen3.6-35B-A3B, llama.cpp and vLLM are level single-stream (138 vs 135.9 tok/s) but vLLM is ~4.8x better at 8 concurrent (666.9 vs 138) because llama.cpp slots are fixed while vLLM shares a PagedAttention pool. Prefer vLLM for multi-stream agent work, llama.cpp for models too large for VRAM (it alone has --n-cpu-moe). SWEEP METHOD (adopted 2026-08-04 after testing models one-at-a-time proved far too slow): every model load takes 3-8 minutes, longer than one shell call, so drive them from a detached script that tries configs widest-context-first, stops at the first that loads, benchmarks, appends one line per model to a results file, and never blocks. Four models swept in 13 minutes that way. Two rules make it work: readiness is a non-503 from /props (NOT /health, which returns 200 while still loading on b10270), and every server must be setsid-detached or a shell timeout SIGTERMs the whole process group. Sweep numbers are provisional by design — a flat --tensor-split 0.5,0.5 keeps it unattended but leaves dangerous headroom (35B Q6 came back with 124MiB free on CUDA0), so winners need a second pass to re-bisect the split. Also treat sweep throughput as pessimistic if anything else is using the machine: coder-next read 37.8 tok/s during a concurrent 40GB download versus 67.3 measured in isolation, because its CPU-offloaded expert layers contend for the same cores. QUANT LADDER measured on Qwen3.6-35B-A3B: Q4_K_XL 4x256K @ 138.1 tok/s, Q6_K_XL 4x256K @ 132.0, Q8_K_XL only 4x128K @ 77.8 — Q6 is the sweet spot (4% slower than Q4, full context, higher precision) and Q8 is a trap on this hardware, costing half the speed AND half the context. SPLIT-TUNING RULE learned the hard way 2026-08-04: before bisecting --tensor-split, check the TOTAL free VRAM across BOTH cards. If the total is under ~2GB there is no split that leaves a safe margin on each, and bisecting is wasted effort — lowering the split simply moves gigabytes onto the other card and OOMs it. Both 35b-q6 (total free 1612MiB at 4x256K) and glm47 (1790MiB at 4x160K) failed every split attempted; dropping context by one step freed enough KV that the near-default split balanced on the FIRST try, giving 4340 and 4378MiB total respectively. Context is the coarse knob, split is the fine one — use them in that order. LLAMA.CPP CONCURRENCY SCALING measured across six models 2026-08-04 (aggregate tok/s at 1/2/4/8 streams): 35b-q4 107/189/235/227 (2.19x), 35b-q6 98/176/220/208 (2.24x), glm47 100/168/212/216 (2.16x), coder-next 30/69/91/87 (3.07x), 27b-q8 27/47/46 at np=2 (1.73x), qwen35-122b 9/12/13/13 (1.44x). EVERY model peaks at FOUR concurrent and declines at 8 except glm47, which is flat. TTFT at 8 concurrent degrades badly everywhere: 3.8s (glm47) to 64.8s (122b). Per-stream roughly halves from 1 to 4 streams. SAME-MODEL ENGINE COMPARISON on Qwen3.6-35B-A3B: llama.cpp single-stream 138.2 vs vLLM 135.9 (level), but aggregate at 8 concurrent is 227 vs 667 and TTFT 4.11s vs 0.57s — vLLM scales 4.98x where llama.cpp manages 2.19x. The mechanism is visible in per-stream rates: llama.cpp's fixed slots share a serialised decode loop so per-stream collapses 138 -> 68, while vLLM's continuous batching holds per-stream near 91 while aggregate keeps climbing. MEASUREMENT CAVEAT: a 45GB download ran throughout, which depresses CPU-offloaded models specifically — coder-next read 30 tok/s single-stream here against 67.3 in isolation. Pure-VRAM models were largely unaffected. VRAM CEILING FOR vLLM ON THIS BOX, established 2026-08-04: usable VRAM is 2 x 23.56 = 47.1 GiB, and the desktop permanently holds ~0.7 GiB on CUDA0, so --gpu-memory-utilization 0.97 is refused at startup on that card no matter what. Practical ceiling is 0.96. After weights, vLLM still needs room for activations, CUDA graphs and KV — Qwen3-Coder-Next-AWQ-4bit at 44.9 GiB of weights left ~1.5 GiB for all three and OOM'd on a 298 MiB allocation even at 32K context with max-num-seqs 4. TREAT ~40 GiB OF WEIGHTS AS THE PRACTICAL vLLM LIMIT here; above that the model is llama.cpp-only, because --n-cpu-moe can push experts to system RAM and vLLM has no equivalent worth using on PCIe 3.0 x16. Also: verify exact byte counts on the HF API before downloading anything that must fit VRAM exactly — the AWQ was estimated at '~40 GB' and arrived 12% larger, which is the entire difference between fitting and not. AMPERE FP8 KV LIMIT found 2026-08-05: these RTX 3090s are sm_86, and some models' fp8 KV path needs E4M3 (Triton 'fp8e4nv'), which requires Ada 8.9 or Hopper 9.0 — it fails with 'Device capability 8.6 not supported' then 'type fp8e4nv not supported in this architecture; supported are (fp8e4b15, fp8e5)'. This is MODEL-SPECIFIC, not a blanket limit: 27b-fp8, 35b-moe-vllm and coder-30b all use --kv-cache-dtype fp8 fine, while GLM-4.7-Flash (Glm4MoeLiteForCausalLM) does not. FP8 *weights* work on Ampere via Marlin in every case — it is only the KV cache path that differs, so diagnose by removing --kv-cache-dtype fp8 first rather than assuming the weights are at fault. When fp8 KV is unavailable the f16 fallback roughly doubles KV cost (GLM measured 52.9 KiB/token), which can put the 128K floor out of reach even on a model whose weights fit comfortably. ANOTHER GOTCHA: vLLM validates max-model-len against the model's own max_position_embeddings BEFORE loading weights, so an over-large value fails in seconds rather than after an 8-minute load — GLM-4.7-Flash is 202,752, not the 262,144 assumed. PROCESS RULE: never monitor a load with 'pgrep -f <pattern>' where the pattern appears in your own command line — it self-matches and reports a phantom process. Put the launch in a script file and verify by LOG GROWTH and VRAM ALLOCATION instead; this cost ~20 minutes of watching a process that did not exist. MANDATORY PRE-DOWNLOAD CHECK, added 2026-08-05 after wasting a 41GB download: compute KV-per-token from the model's config.json on HF BEFORE downloading anything, and verify weights + KV_at_target_context <= 48 GiB. KV/token = n_layer x (key_length + value_length) x n_head_kv x bytes_per_elem (q8_0 ~1 byte, q4_0 ~0.5). THE DENSE/HYBRID SPLIT DOMINATES THIS: hybrid Qwen models carry KV on only ~12 of 48 layers (24 KiB/token), GLM-4.7-Flash 53 KiB/token, but Mistral-Medium-3.5 is DENSE with KV on all 88 layers = 176 KiB/token — 7x the Qwen hybrids. At 128K that is 22 GiB of KV alone, so a 41GiB-weight quant cannot reach the 128K floor at ANY quantisation (would need weights under ~24 GiB, i.e. ~1.5 bits for a 128B model). It only ran at 32K with q4_0 KV. QUALITY RESULT: the 'bigger dense wins' hypothesis FAILED. Mistral-Medium-3.5 128B dense at IQ2_M scored 4/6 objective, philosophy 4/5, technical 2/5 (named randomized constraint ordering, missed warm starting) at 13.7 tok/s, versus Qwen3.6-27B dense FP8 at 3/3 objective, 5/5 philosophy, 5/5 technical, 45 tok/s and 256K usable context. It was notably terse (258-471 tok/answer vs 3000-6000 for the Qwen MoEs) and was one of only two models to pass js_debounce, but it is not better. HARDWARE IMPLICATION: large-dense-at-long-context needs ~86 GiB (64GB Q4 weights + 22 GiB KV), which dual RTX 5090s (64GB) cannot hold and Strix Halo / DGX Spark 128GB can — but at ~256 GB/s those would decode a 64GB model at roughly 4 tok/s. That combination is not achievable at usable speed on any consumer hardware today, so more VRAM does not buy quality along this axis. MISTRAL LINEUP SURVEYED 2026-08-08, full detail in docs/mistral-lineup-survey-2026-08.md: THE DENSE/HYBRID KV SPLIT IS REALLY A THREE-WAY SPLIT, AND MLA IS THE CHEAP CORNER. Mistral-Small-4-119B-2603 is MLA (kv_lora_rank 256, q_lora_rank 1024, qk_rope_head_dim 64); llama.cpp routes LLM_ARCH_MISTRAL4 onto the DEEPSEEK2 path and MLA models allocate NO V CACHE AT ALL (llama-kv-cache.cpp: has_v = !is_mla), so the cache is just the 320-wide compressed latent over 36 layers = 11.25 KiB/token, against 176 for Medium 3.5 and 24 for the hybrid Qwens. CONSEQUENCE: a 119B model DOES hold the 128K floor on this box (UD-IQ2_M 34.99 GiB + 1.4 GiB KV = 36.4 GiB, and even 4x128K slots = 40.6 GiB). The 'large-dense-at-long-context needs ~86 GiB' conclusion above is about DENSE attention and does NOT generalise to MLA. SO: READ THE ATTENTION FAMILY off config.json BEFORE estimating KV — taking num_key_value_heads at face value reads Small 4 as 288 KiB/token, wrong by 25x and disqualifying by mistake. Small 4 is llama.cpp-ONLY here: vLLM 0.23.0 has no mistral4 implementation at all (it does have Mistral3ForConditionalGeneration / Ministral3ForCausalLM / MistralForCausalLM). Expect Small 4 to LOSE on quality regardless: reconstructed at ~6.6B ACTIVE of 119B (128 routed + 1 shared expert, top-4, moe_intermediate_size 2048; the reconstruction totals 119.0B and matches the repo), which is fewer active than the 122B-A10B and 284B-A13B that already lost to the 27B dense. DEVSTRAL-2-123B-2512 MUST NOT BE DOWNLOADED — it is Medium 3.5's geometry exactly (88 layers, 8 KV heads, head_dim 128 = 176 KiB/token = 22 GiB at 128K) and so misses the floor at EVERY quant that exists, including UD-IQ1_S (26.49 + 22.0 = 48.5 GiB). It looks like a fresh Dec-2025 coding model and is the same wall. THE ONLY MISTRAL WORTH SERVING is Devstral-Small-2-24B-Instruct-2512: 40 layers = 80 KiB/token, FP8 24.02 GiB, 34.0 GiB total at 128K, max_position_embeddings 393216 (vs exactly 131072 for the superseded Magistral-Small-2509 and Mistral-Small-3.2-24B, i.e. zero headroom), and 24B DENSE is the only current Mistral whose ACTIVE params are in the incumbent's class. Ministral-3 3B/8B/14B fit trivially (14B Q8_0 = 23.4 GiB at 128K) but carry ~half the incumbent's active params. FETCHED 2026-08-09, both UNTESTED as of writing: gdubicki/Devstral-Small-2-24B-Instruct-2512-FP8 -> models/hf/, and unsloth Mistral-Small-4-119B-2603-UD-IQ2_M -> models/gguf/mistral-small-4-119b/. Devstral open risk: fp8 KV on sm_86 is unproven for this arch, drop --kv-cache-dtype fp8 first if it fails (f16 doubles it to 160 KiB/token = 20 GiB at 128K, still fits but tight)."
