MACHINE_NAME="DW-ASUS-LINUX"
NOTES="Dual RTX 3090 (24GB each, 48GB total), 62GB quad-channel DDR3, i7-4930K (6c/12t, AVX only — no AVX2/FMA, which halves llama.cpp CPU-expert throughput). PCIe 3.0 x16, so vLLM weight-offload (~15.75GB/s over the bus) is slower than llama.cpp computing experts in place at RAM bandwidth (~35-40GB/s). GPU0 also drives the desktop, so leave 1-2GB VRAM headroom there; slot 1 runs ~10C hotter than slot 2 regardless of card. Both cards capped at 300W."
ACCEL=cuda
GPUS_DEFAULT="0,1"
TENSOR_PARALLEL_DEFAULT=2
VRAM_PER_GPU_MB=24576
VLLM_BIN="/home/david/.venvs/vllm/bin/vllm"
LLAMA_SERVER="/home/david/work/llama.cpp/build/bin/llama-server"
MODELS_DIR="/home/david/models"
WIZARD_BASE_PORT=19438
ENABLE_BUILTIN_MODELS=1
HERMES_ENABLE=1
OPENCLAW_ENABLE=1
WEBUI_ENABLE=1
WEBUI_CONTAINER="open-webui"
WEBUI_PORT=8088
WEBUI_IMAGE="ghcr.io/open-webui/open-webui:main"
LEGACY_UNITS="qwen-dual3090-27b-q8-llamacpp.service qwen-dual3090-35b-moe-llamacpp.service qwen-dual3090-27b-fp8-vllm.service qwen-dual3090-35b-moe-vllm.service local-agent-qwen.service"
