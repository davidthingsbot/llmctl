MACHINE_NAME="DW-ASUS-LINUX"
NOTES="Dual RTX 3090 (24GB each, 48GB total), 62GB quad-channel DDR3, i7-4930K (6c/12t, AVX only — no AVX2/FMA, which halves llama.cpp CPU-expert throughput). PCIe 3.0 x16, so vLLM weight-offload (~15.75GB/s over the bus) is slower than llama.cpp computing experts in place at RAM bandwidth (~35-40GB/s). GPU0 also drives the desktop, so leave 1-2GB VRAM headroom there; slot 1 runs ~10C hotter than slot 2 regardless of card. Both cards capped at 300W. llama.cpp UPGRADED b8189 -> b10270 on 2026-08-04 (+2080 commits), rebuilt in place at /home/david/work/llama.cpp/build; rollback binaries in build/bin/rollback-b8189/ and 'git checkout b8189'. The upgrade alone roughly DOUBLED generation on existing models (coder-next 52 -> 118 tok/s unoffloaded). It also added arch 'deepseek4' (and 'deepseek32'), without which DeepSeek-V4-Flash cannot load at all. UNIVERSAL RULES learned across all local models: (1) -fit off is required whenever --n-cpu-moe or an explicit --tensor-split is used, because llama_params_fit refuses configs that actually fit merely to reserve 1024MiB/card; (2) --tensor-split must be given manually and RE-BISECTED after any --n-cpu-moe change, since offload makes the first N layers light and an even split then overloads the second GPU; (3) -ctk q8_0 -ctv q8_0 roughly halves KV, validated for quality at 120K depth; (4) --no-mmap is ESSENTIAL when the model exceeds RAM — with mmap the kernel treats CPU-resident expert weights as evictable page cache and re-reads them from disk every token (DeepSeek 284B: 1.48 -> 6.39 tok/s, 4.3x, from --no-mmap alone). READINESS DETECTION on b10270: /health returns 200 while the model is still loading — poll /props and wait for a non-503, and note the log no longer prints 'main loop' (it prints 'model loaded'/'listening on') and -lv LOWERS verbosity below the default 3. Long loads need setsid, not nohup: a tool/shell timeout SIGTERMs the whole process group and silently kills a nohup'd load. vLLM (still 0.23.0, NOT upgraded — only llama.cpp was) RULES learned 2026-08-04: (a) --max-num-batched-tokens must exceed the Mamba-aligned attention block size on hybrid Qwen models — the default 2048 sits just under the 2096 block and the engine asserts 'In Mamba cache align mode, block_size must be <= max_num_batched_tokens'; use 4096. This failure looks unrelated to whatever you changed and is probably why these recipes sat at conservative settings. (b) vLLM refuses to start unless ONE full-length request fits, printing the exact byte comparison — useful for sizing. (c) --kv-cache-memory-bytes overrides --gpu-memory-utilization entirely; a BIGGER KV pool measured FASTER (622.9 -> 666.9 tok/s at 8 concurrent) because fewer preemptions, so there is no capacity/throughput tradeoff, only a memory-safety one. (d) Testing vLLM outside llmctl requires replicating the recipe's ENVIRONMENT, not just its flags: PATH must include the venv bin or torch.compile fails with \"No such file or directory: 'ninja'\". (e) ENGINE CHOICE: on the identical Qwen3.6-35B-A3B, llama.cpp and vLLM are level single-stream (138 vs 135.9 tok/s) but vLLM is ~4.8x better at 8 concurrent (666.9 vs 138) because llama.cpp slots are fixed while vLLM shares a PagedAttention pool. Prefer vLLM for multi-stream agent work, llama.cpp for models too large for VRAM (it alone has --n-cpu-moe). SWEEP METHOD (adopted 2026-08-04 after testing models one-at-a-time proved far too slow): every model load takes 3-8 minutes, longer than one shell call, so drive them from a detached script that tries configs widest-context-first, stops at the first that loads, benchmarks, appends one line per model to a results file, and never blocks. Four models swept in 13 minutes that way. Two rules make it work: readiness is a non-503 from /props (NOT /health, which returns 200 while still loading on b10270), and every server must be setsid-detached or a shell timeout SIGTERMs the whole process group. Sweep numbers are provisional by design — a flat --tensor-split 0.5,0.5 keeps it unattended but leaves dangerous headroom (35B Q6 came back with 124MiB free on CUDA0), so winners need a second pass to re-bisect the split. Also treat sweep throughput as pessimistic if anything else is using the machine: coder-next read 37.8 tok/s during a concurrent 40GB download versus 67.3 measured in isolation, because its CPU-offloaded expert layers contend for the same cores. QUANT LADDER measured on Qwen3.6-35B-A3B: Q4_K_XL 4x256K @ 138.1 tok/s, Q6_K_XL 4x256K @ 132.0, Q8_K_XL only 4x128K @ 77.8 — Q6 is the sweet spot (4% slower than Q4, full context, higher precision) and Q8 is a trap on this hardware, costing half the speed AND half the context. SPLIT-TUNING RULE learned the hard way 2026-08-04: before bisecting --tensor-split, check the TOTAL free VRAM across BOTH cards. If the total is under ~2GB there is no split that leaves a safe margin on each, and bisecting is wasted effort — lowering the split simply moves gigabytes onto the other card and OOMs it. Both 35b-q6 (total free 1612MiB at 4x256K) and glm47 (1790MiB at 4x160K) failed every split attempted; dropping context by one step freed enough KV that the near-default split balanced on the FIRST try, giving 4340 and 4378MiB total respectively. Context is the coarse knob, split is the fine one — use them in that order. LLAMA.CPP CONCURRENCY SCALING measured across six models 2026-08-04 (aggregate tok/s at 1/2/4/8 streams): 35b-q4 107/189/235/227 (2.19x), 35b-q6 98/176/220/208 (2.24x), glm47 100/168/212/216 (2.16x), coder-next 30/69/91/87 (3.07x), 27b-q8 27/47/46 at np=2 (1.73x), qwen35-122b 9/12/13/13 (1.44x). EVERY model peaks at FOUR concurrent and declines at 8 except glm47, which is flat. TTFT at 8 concurrent degrades badly everywhere: 3.8s (glm47) to 64.8s (122b). Per-stream roughly halves from 1 to 4 streams. SAME-MODEL ENGINE COMPARISON on Qwen3.6-35B-A3B: llama.cpp single-stream 138.2 vs vLLM 135.9 (level), but aggregate at 8 concurrent is 227 vs 667 and TTFT 4.11s vs 0.57s — vLLM scales 4.98x where llama.cpp manages 2.19x. The mechanism is visible in per-stream rates: llama.cpp's fixed slots share a serialised decode loop so per-stream collapses 138 -> 68, while vLLM's continuous batching holds per-stream near 91 while aggregate keeps climbing. MEASUREMENT CAVEAT: a 45GB download ran throughout, which depresses CPU-offloaded models specifically — coder-next read 30 tok/s single-stream here against 67.3 in isolation. Pure-VRAM models were largely unaffected. VRAM CEILING FOR vLLM ON THIS BOX, established 2026-08-04: usable VRAM is 2 x 23.56 = 47.1 GiB, and the desktop permanently holds ~0.7 GiB on CUDA0, so --gpu-memory-utilization 0.97 is refused at startup on that card no matter what. Practical ceiling is 0.96. After weights, vLLM still needs room for activations, CUDA graphs and KV — Qwen3-Coder-Next-AWQ-4bit at 44.9 GiB of weights left ~1.5 GiB for all three and OOM'd on a 298 MiB allocation even at 32K context with max-num-seqs 4. TREAT ~40 GiB OF WEIGHTS AS THE PRACTICAL vLLM LIMIT here; above that the model is llama.cpp-only, because --n-cpu-moe can push experts to system RAM and vLLM has no equivalent worth using on PCIe 3.0 x16. Also: verify exact byte counts on the HF API before downloading anything that must fit VRAM exactly — the AWQ was estimated at '~40 GB' and arrived 12% larger, which is the entire difference between fitting and not."
