MACHINE_NAME="DW-ASUS-LINUX"
NOTES="Dual RTX 3090 (24GB each, 48GB total), 62GB quad-channel DDR3, i7-4930K (6c/12t, AVX only — no AVX2/FMA, which halves llama.cpp CPU-expert throughput). PCIe 3.0 x16, so vLLM weight-offload (~15.75GB/s over the bus) is slower than llama.cpp computing experts in place at RAM bandwidth (~35-40GB/s). GPU0 also drives the desktop, so leave 1-2GB VRAM headroom there; slot 1 runs ~10C hotter than slot 2 regardless of card. Both cards capped at 300W. llama.cpp UPGRADED b8189 -> b10270 on 2026-08-04 (+2080 commits), rebuilt in place at /home/david/work/llama.cpp/build; rollback binaries in build/bin/rollback-b8189/ and 'git checkout b8189'. The upgrade alone roughly DOUBLED generation on existing models (coder-next 52 -> 118 tok/s unoffloaded). It also added arch 'deepseek4' (and 'deepseek32'), without which DeepSeek-V4-Flash cannot load at all. UNIVERSAL RULES learned across all local models: (1) -fit off is required whenever --n-cpu-moe or an explicit --tensor-split is used, because llama_params_fit refuses configs that actually fit merely to reserve 1024MiB/card; (2) --tensor-split must be given manually and RE-BISECTED after any --n-cpu-moe change, since offload makes the first N layers light and an even split then overloads the second GPU; (3) -ctk q8_0 -ctv q8_0 roughly halves KV, validated for quality at 120K depth; (4) --no-mmap is ESSENTIAL when the model exceeds RAM — with mmap the kernel treats CPU-resident expert weights as evictable page cache and re-reads them from disk every token (DeepSeek 284B: 1.48 -> 6.39 tok/s, 4.3x, from --no-mmap alone). READINESS DETECTION on b10270: /health returns 200 while the model is still loading — poll /props and wait for a non-503, and note the log no longer prints 'main loop' (it prints 'model loaded'/'listening on') and -lv LOWERS verbosity below the default 3. Long loads need setsid, not nohup: a tool/shell timeout SIGTERMs the whole process group and silently kills a nohup'd load. vLLM (still 0.23.0, NOT upgraded — only llama.cpp was) RULES learned 2026-08-04: (a) --max-num-batched-tokens must exceed the Mamba-aligned attention block size on hybrid Qwen models — the default 2048 sits just under the 2096 block and the engine asserts 'In Mamba cache align mode, block_size must be <= max_num_batched_tokens'; use 4096. This failure looks unrelated to whatever you changed and is probably why these recipes sat at conservative settings. (b) vLLM refuses to start unless ONE full-length request fits, printing the exact byte comparison — useful for sizing. (c) --kv-cache-memory-bytes overrides --gpu-memory-utilization entirely; a BIGGER KV pool measured FASTER (622.9 -> 666.9 tok/s at 8 concurrent) because fewer preemptions, so there is no capacity/throughput tradeoff, only a memory-safety one. (d) Testing vLLM outside llmctl requires replicating the recipe's ENVIRONMENT, not just its flags: PATH must include the venv bin or torch.compile fails with \"No such file or directory: 'ninja'\". (e) ENGINE CHOICE: on the identical Qwen3.6-35B-A3B, llama.cpp and vLLM are level single-stream (138 vs 135.9 tok/s) but vLLM is ~4.8x better at 8 concurrent (666.9 vs 138) because llama.cpp slots are fixed while vLLM shares a PagedAttention pool. Prefer vLLM for multi-stream agent work, llama.cpp for models too large for VRAM (it alone has --n-cpu-moe). SWEEP METHOD (adopted 2026-08-04 after testing models one-at-a-time proved far too slow): every model load takes 3-8 minutes, longer than one shell call, so drive them from a detached script that tries configs widest-context-first, stops at the first that loads, benchmarks, appends one line per model to a results file, and never blocks. Four models swept in 13 minutes that way. Two rules make it work: readiness is a non-503 from /props (NOT /health, which returns 200 while still loading on b10270), and every server must be setsid-detached or a shell timeout SIGTERMs the whole process group. Sweep numbers are provisional by design — a flat --tensor-split 0.5,0.5 keeps it unattended but leaves dangerous headroom (35B Q6 came back with 124MiB free on CUDA0), so winners need a second pass to re-bisect the split. Also treat sweep throughput as pessimistic if anything else is using the machine: coder-next read 37.8 tok/s during a concurrent 40GB download versus 67.3 measured in isolation, because its CPU-offloaded expert layers contend for the same cores. QUANT LADDER measured on Qwen3.6-35B-A3B: Q4_K_XL 4x256K @ 138.1 tok/s, Q6_K_XL 4x256K @ 132.0, Q8_K_XL only 4x128K @ 77.8 — Q6 is the sweet spot (4% slower than Q4, full context, higher precision) and Q8 is a trap on this hardware, costing half the speed AND half the context."
