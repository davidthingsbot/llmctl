NOTES="MoE 80B total / 3B active hybrid (48 layers: 12 full-attention + 36 Gated DeltaNet, full_attention_interval=4), Apache 2.0. Fits ENTIRELY in VRAM at UD-IQ4_XS (38.4GiB) with the full 262144 context — no CPU offload — which is why it reaches ~1955 tok/s prefill and ~52-81 tok/s generation. UD-Q4_K_XL (49.6GiB) and Q4_K_M (49.3GiB) overflow 49152MiB and would force offload. --tensor-split 0.47,0.53 is REQUIRED: the hybrid stack splits unevenly under 1,1 (18796 vs 17532MiB) and CUDA0 then OOMs reserving its compute buffer. Measured KV only 24KiB/token (12 attention layers), 3072MiB/card at 256K. One 'cudaMalloc failed' for a 2416MiB compute buffer falling back to pinned host memory is EXPECTED and benign — forcing it onto the GPU with -ub 256 measured slower. temp 1.0 is Qwen's explicit recommendation for this model, not a typo. Tool calls work natively via --jinja; no parser plugin needed. RETUNED 2026-08-04 on llama.cpp b10270: was 1 slot x 262144 with no offload; now 4 slots x 163840 via --n-cpu-moe 4 + -ctk/-ctv q8_0 + -fit off, at 67.3 tok/s with 828/1304MiB VRAM free. The b10270 upgrade alone took unoffloaded generation from ~52 to 118 tok/s, and spending 4 of 48 expert layers on CPU converts ~50 of that into four concurrent 160K sessions — which is what hermes actually needs, since it runs a main thread plus bg-review plus children. Without offload, 4 slots fit only at 128-152K and left 38-466MiB free, far too tight for a card that also drives the desktop. --tensor-split 0.47,0.53 is CORRECT ONLY WITH NO OFFLOAD; with --n-cpu-moe 4 it overflowed CUDA1 by 1492MiB and had to be re-bisected to 0.52,0.48. CONCURRENCY measured 2026-08-04 at 4x163840 (aggregate tok/s): 1=30, 2=69, 4=91, 8=87 — best scaling of any llama.cpp model measured here at 3.07x, peaking at 4 concurrent. TTFT at 8 concurrent is 9.84s. NOTE these figures are DEPRESSED: a 45GB download was competing for CPU throughout, and single-stream read 30 tok/s against 67.3 measured in isolation, because the 4 CPU-offloaded expert layers contend for the same cores. Re-measure on a quiet machine before trusting the absolute numbers; the SHAPE (peak at 4) is still valid."
