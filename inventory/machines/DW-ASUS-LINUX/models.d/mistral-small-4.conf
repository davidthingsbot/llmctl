# Mistral-Small-4-119B-2603 UD-IQ2_M — TESTED 2026-08-09.
# VERDICT, TWO PARTS, AND THEY POINT OPPOSITE WAYS:
#   HARDWARE CLAIM CONFIRMED. A 119B model DOES hold four 128K slots on two
#   3090s: 44,363 MiB of 48 GiB, loading in 28 seconds. The machine.conf note
#   that large-at-long-context needs ~86 GiB was about DENSE attention and does
#   NOT generalise — MLA breaks it. This is the durable finding.
#   QUALITY REJECTED. work_quality 70/100, deep_reasoning 53/100 against the
#   incumbent 27b-fp8 at 83 and 70, and LAST of three in a blind 3-judge review
#   of the open responses (7.63/20 vs 17.27 for 27b-fp8 and 10.60 for Devstral).
#
# MEASURED KV — AND MY PREDICTION WAS WRONG BY 35%, SO READ THIS BEFORE REUSING
# THE PRE-DOWNLOAD CHECK ON AN MLA MODEL.
#   Predicted 11.25 KiB/token (36 layers x 320-wide latent x 1 byte).
#   MEASURED 15.22 KiB/token, by differencing VRAM across three context sizes:
#     4x131072 = 524,288 tok -> 44,363 MiB
#     4x 65536 = 262,144 tok -> 40,465 MiB
#     4x 32768 = 131,072 tok -> 38,519 MiB
#   Two independent intervals agree to 0.2% (15.23 and 15.20), linear fit slope
#   15.22 with intercept 36,570 MiB against 35,834 MiB of weights, i.e. ~736 MiB
#   of fixed buffers. This is a solid measurement, not an estimate.
#   WHY THE PREDICTION MISSED: re-running at -ctk f16 gave 24.25 KiB/token, a
#   9.03 KiB/token delta. Only the 256-wide compressed latent is quantised; the
#   64 RoPE dims stay f16 either way. Plus q8_0 is 1.0625 B/elem, not 1.0, and
#   there is ~8% allocation overhead (8.2% at q8_0, 7.8% at f16 — consistent).
#   CORRECTED RULE FOR MLA ON llama.cpp:
#     KV/token = n_layer x (kv_lora_rank x 1.0625 + qk_rope_head_dim x 2) x 1.08
#     = 36 x (256x1.0625 + 64x2) x 1.08 = 15.19 KiB/token vs 15.22 measured.
#   Still 11.6x cheaper than Mistral-Medium-3.5 (176) and cheaper than the
#   hybrid Qwens (~24), so the conclusion holds — the margin is just smaller.
#
# SPEED: single-stream 124.1 tok/s, more than double the incumbent (47.9) — what
# ~6.6B active buys. But it scales only 2.08x to 8 streams (241.4 aggregate vs
# Devstral 419.1) and TTFT at 8 concurrent is 6.70s against 0.10s, because 8
# clients queue against 4 fixed llama.cpp slots. Prefill 3057 tok/s.
#
# QUALITY SHAPE IS ODD AND WORTH KNOWING: it scored a PERFECT 18/18 on
# protocol_architecture, the open design task no model had ever beaten (previous
# best anywhere 12/18), yet only 10/16 on long_context_retrieval where both
# other models scored 16/16, and 1/10 on bom_consolidation. A model sold on
# cheap long context that misses facts at 35K depth is a hard sell; the 2-bit
# quant is the obvious suspect.
#
# FIT NOTE: 44,363 of 47.1 GiB leaves only ~2.7 GiB free across both cards. Per
# the SPLIT-TUNING RULE that is tight; it loaded and served on the first try at
# --tensor-split 0.5,0.5, but there is no room to raise context or slots.
# llmctl also passes its own --tensor-split 1,1, so llama.cpp logs a DEPRECATED
# warning about the argument appearing twice; the last value (ours) wins.
#
# ORIGINAL RATIONALE follows.
#
# THE POINT OF THIS TEST IS THE KV NUMBER, NOT THE QUALITY SCORE.
# This is the first MLA model in the Mistral family here, and machine.conf
# currently records that a large model cannot hold the 128K floor on 48 GiB —
# a conclusion drawn from DENSE attention. Small 4 should break it.
#
# arch=mistral4, 36 layers, 128 routed experts top-4 + 1 shared, 1,048,576 native
# context (YaRN 128x from 8192 trained, so quality far above ~64K is unproven).
# MLA: kv_lora_rank 256, q_lora_rank 1024, qk_nope/rope 64/64, v_head_dim 128.
#
# PREDICTED KV — the number this test exists to confirm:
#   llama.cpp routes LLM_ARCH_MISTRAL4 onto the DEEPSEEK2 MLA path, and MLA
#   models allocate NO V CACHE (llama-kv-cache.cpp: has_v = !is_mla). The cache
#   is the compressed latent only, kv_lora_rank + qk_rope_head_dim = 320 wide:
#     36 x 320 x 1 byte = 11,520 B = 11.25 KiB/token
#   vs 176 KiB/token for Mistral-Medium-3.5 and ~24 for the hybrid Qwens.
#   At 4 x 131072 = 524,288 tokens that is only 5.63 GiB of KV.
# Weights 34.994 GiB (verified on disk against the HF API) + 5.63 KV = 40.6 GiB
# of 47.1 usable, so this should fit WITHOUT --n-cpu-moe. If it does, a 119B
# model holds four 128K slots on two 3090s.
#
# EXPECT IT TO LOSE ON QUALITY. Reconstructed at ~6.6B ACTIVE of 119B, fewer
# active than the 122B-A10B and 284B-A13B that already lost to the 27B dense.
# See docs/mistral-lineup-survey-2026-08.md.
#
# ENGINE: llama.cpp ONLY — vLLM 0.23.0 has no mistral4 implementation at all.
# -ctv q8_0 is passed for symmetry with the deepseek-v4-flash recipe; it is inert
# on an MLA model, which has no V cache to quantise.
# --no-mmap NOT used: 35 GiB of weights fits in 62 GiB of RAM, so the page-cache
# eviction problem that forced --no-mmap on DeepSeek-V4-Flash does not apply.
