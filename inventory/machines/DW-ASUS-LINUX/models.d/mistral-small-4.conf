NOTES="TESTED 2026-08-09. HARDWARE CLAIM CONFIRMED, QUALITY REJECTED. A 119B model DOES hold four 128K slots on two 3090s — 44,363 MiB of 48 GiB, 28s load — so the recorded note that large-at-long-context needs ~86 GiB applies to DENSE attention only and MLA breaks it. But quality loses: work_quality 70/100 and deep_reasoning 53/100 against 27b-fp8 at 83 and 70, and LAST of three in a blind 3-judge review of open responses (7.63/20 vs 17.27 and 10.60). KV MEASURED AT 15.22 KiB/token, NOT the 11.25 predicted — a 35% miss. Measured by differencing VRAM across three context sizes (524,288/262,144/131,072 tokens -> 44,363/40,465/38,519 MiB); two intervals agree to 0.2%, fit slope 15.22 with intercept 36,570 MiB against 35,834 MiB of weights. Cause, found by re-running at -ctk f16 (24.25 KiB/token): only the 256-wide compressed latent is quantised, the 64 RoPE dims stay f16 regardless, q8_0 is 1.0625 B/elem not 1.0, and there is ~8% allocation overhead. CORRECTED MLA RULE: KV/token = n_layer x (kv_lora_rank x 1.0625 + qk_rope_head_dim x 2) x 1.08, giving 15.19 vs 15.22 measured. Still 11.6x cheaper than Medium 3.5. SPEED: 124.1 tok/s single-stream (2.6x the incumbent, from ~6.6B active) but only 2.08x scaling to 8 streams and TTFT 6.70s at 8 concurrent, since 8 clients queue against 4 fixed slots. QUALITY SHAPE: perfect 18/18 on protocol_architecture, the open design task no model had beaten (previous best 12/18), yet 10/16 on long_context_retrieval where the others scored 16/16, and 1/10 on bom_consolidation. FIT: only ~2.7 GiB free across both cards, no room to grow."
