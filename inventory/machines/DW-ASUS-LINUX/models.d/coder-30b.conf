DESC="Qwen3-Coder-30B-A3B MoE FP8, vLLM, 192K, fp8 KV, seqs 8, tool calls"
NOTES="MoE 30B total / 3B active, FP8, fits entirely in VRAM at ~15.1GiB/GPU with TP=2. --kv-cache-dtype fp8 is REQUIRED, not optional: KV costs 96KiB/token at fp16 vs 48KiB at fp8, and util 0.90 leaves only ~4.7GiB/GPU, too little for even one full 131072-token request at fp16. Non-thinking model, so no reasoning parser. Uses a lenient tool-call parser plugin because stock qwen3_coder silently misses tool calls when the model omits the opening <tool_call> tag (observed 2026-07-27 via hermes); the wrapper normalises those. RETUNED 2026-08-04 (vLLM 0.23.0): was 131072 ctx / max-num-seqs 4; now 196608 / seqs 8 with --max-num-batched-tokens 4096 and cudagraph capture [1,2,4,8]. Measured 148.0 tok/s single-stream (156.4 per-stream, the FASTEST single-stream figure on this box) and 680.8 tok/s aggregate at 8 concurrent, 4.60x scaling, TTFT max 0.24s. KV pool 260,864 tokens with 980/1252MiB VRAM free at GPU_UTIL 0.93. CAUTION: this model is KV-HUNGRY at ~24KiB/token EVEN WITH fp8 KV, so despite being half the size of 35b-moe-vllm it holds only ~2.0 concurrent sessions at 131K vs the 35B's 4.4 — the 35B is a hybrid whose Mamba layers carry no KV. Prefer 35b-moe-vllm for multi-stream agent work and this one for fewer, faster streams. Do NOT raise max-model-len to 262144: vLLM then needs 6.0GiB KV for a single full-length request against 5.74GiB available at util 0.92, and refuses to start; util 0.95 does fit it but leaves only 498MiB free on GPU0, which also drives the desktop. --max-num-batched-tokens must stay >= 4096: the default 2048 is below the Mamba-aligned attention block (2096) and the engine dies with 'In Mamba cache align mode, block_size must be <= max_num_batched_tokens'."
