# Devstral-Small-2-24B-Instruct-2512 FP8 — TESTED 2026-08-09. VERDICT: FASTER
# THAN THE INCUMBENT ON EVERY SPEED AXIS, BUT DECISIVELY WORSE ON QUALITY.
# DO NOT ADOPT AS A REPLACEMENT FOR 27b-fp8. Kept registered because it loads
# and serves correctly and may be useful as a fast bounded-task model.
#
# PAIRED MEASUREMENT, same box, same harness, thinking disabled on both:
#   work_quality_suite      Devstral 73/100   vs  27b-fp8 83/100
#   deep_reasoning_suite    Devstral 51/100   vs  27b-fp8 70/100
# Devstral won exactly ONE work task (embedded_c_review 10/12 vs 8/12) and lost
# bom_consolidation 6/10 vs 10/10, protocol_architecture 6/18 vs 10/18, and —
# most damning for a CODING model — code_repair 17/20 vs 20/20 on the
# executed-against-hidden-harness task it should own. On reasoning it lost
# seven of eight tasks, including wason_selection 4/10 vs 9/10 and
# bayesian_reasoning 4/12 vs 8/12.
#
# SPEED (aggregate tok/s | per-stream | TTFT at 1/2/4/8 concurrent):
#   Devstral  57.0/113.9/221.5/419.1 | 57.8->52.9 | TTFT 0.10s at 8
#   27b-fp8   46.6/ 85.8/161.3/295.1 | 47.9->38.8 | TTFT 0.64s at 8
# 21-42% faster everywhere, scales 7.35x vs 6.3x, per-stream decays 8% vs 19%,
# and TTFT at 8 concurrent is 6x better. Load 117 s vs ~282 s.
#
# MEASURED SIZING (confirms the pre-download arithmetic EXACTLY):
#   weights 11.79 GiB/card, KV pool 9.07 GiB/card = 18.14 GiB total
#   GPU KV cache size: 237,728 tokens = 80.0 KiB/token, predicted 80.0
#   1.81x the 128K floor, but BELOW 27b-fp8's tuned ~401K pool.
# fp8 KV WORKS on sm_86 for this arch — no E4M3 error, unlike GLM-4.7-Flash.
# Headroom remains: vLLM notes --gpu-memory-utilization 0.94 is effectively
# 0.9175 once CUDA-graph profiling is counted; 0.9625 would restore the pool.
#
# BENCH WARNING: `llmctl bench` reports ~24-33 tok/s for this model and is WRONG.
# Devstral is terse and stops after ~11 tokens on the bench prompt, so fixed
# overhead dominates the average. Forced-length generation measures 57.9 tok/s.
# Do not trust the recorded start-bench pp/gen figures for terse models.
#
# ORIGINAL SELECTION RATIONALE follows.
# The only current-generation Mistral whose ACTIVE parameter count is in the
# class of the incumbent 27b-fp8 (24B dense vs 27B dense). Selected by the
# pre-download KV check; see docs/mistral-lineup-survey-2026-08.md.
#
# SIZING: 40 layers x 8 KV heads x head_dim 128 = 80 KiB/token at 1 byte/elem.
#   weights 24.02 GiB (verified: 24.0217 actual vs 24.0215 index)
#   KV at 128K = 10.0 GiB total, 5.0 GiB/card at TP=2
#   => 34.0 GiB of 47.1 usable, with real margin.
# max_position_embeddings is 393216, so the 128K floor has large headroom
# (Magistral-Small-2509 and Mistral-Small-3.2 sit at exactly 131072 — none).
#
# --tokenizer-mode mistral IS REQUIRED, and the failure without it is misleading.
# With the default (auto) the load dies in seconds, before any weights, with
#   AttributeError: CachedMistralCommonBackend has no attribute is_fast
# at vllm/tokenizers/registry.py:256. Cause: vLLM's auto-detection asks
# is_mistral_model_repo(), which looks for consolidated*.safetensors — this FP8
# repo ships model-0000N-of-00006.safetensors instead, so auto-detect says "not
# a Mistral repo" and falls back to tokenizer_mode=hf. But transformers 5.12.1's
# AutoTokenizer then picks MistralCommonBackend ANYWAY off tekken.json, and that
# class has no .is_fast, which vLLM accesses unconditionally. vLLM's OWN
# MistralTokenizer does define is_fast (vllm/tokenizers/mistral.py:301), so
# forcing the mistral mode takes a code path that works.
# NOTE FOR OTHER MISTRAL REPOS: quants that ship consolidated*.safetensors (e.g.
# the cyankiwi AWQ builds) auto-detect correctly and do not need the flag. The
# trigger is a repacked repo that keeps tekken.json but renames the shards.
#
# --limit-mm-per-prompt '{"image":0}' IS ALSO REQUIRED, for a second, separate
# reason. With tokenizer-mode mistral, vLLM's multimodal PROFILING step feeds
# '[IMG]' through PixtralProcessor and dies:
#   ValueError: Mismatch in `image` token count between text and `input_ids`.
#               Got ids=[0] and text=[1]
#   ValueError: Failed to apply PixtralProcessor on data={'text': '[IMG]'}
# vLLM's MistralTokenizer and the HF PixtralProcessor disagree about the image
# token, so the dummy-image profile never matches. Setting the image limit to 0
# skips that path entirely. This is the RIGHT config here regardless: we are
# evaluating a coding/agent model against a text-only incumbent, and dropping
# the vision tower saves VRAM.
#
# DO NOT "FIX" THIS BY DELETING tekken.json. That does make both auto-detectors
# agree on the HF fast tokenizer and clears BOTH errors — but transformers then
# warns that this repo's tokenizer.json carries an INCORRECT REGEX PATTERN that
# 'will lead to incorrect tokenization' unless loaded with fix_mistral_regex=True
# (see mistralai/Mistral-Small-3.1-24B-Instruct-2503 discussion #84). Silently
# wrong tokenisation would invalidate every quality number measured here. The
# mistral_common path via tekken.json is the authoritative tokeniser — keep it.
# Tested and reverted 2026-08-09.
#
# OPEN RISK being tested: fp8 KV on sm_86. The Ampere E4M3 gap is MODEL-SPECIFIC
# — 27b-fp8 / 35b-moe-vllm / coder-30b all use fp8 KV fine, GLM-4.7-Flash cannot.
# If this fails with "Device capability 8.6 not supported" / "fp8e4nv not
# supported", drop --kv-cache-dtype fp8 FIRST before suspecting the weights
# (FP8 weights load via Marlin regardless). f16 KV doubles to 160 KiB/token =
# 20 GiB at 128K, which still fits but leaves little room.
BACKEND=vllm
PORT=19446
MODEL_REF="/home/david/models/hf/Devstral-Small-2-24B-Instruct-2512-FP8"
MODEL_ID="devstral-small-2-24b-fp8"
CTX=131072
DESC="TESTED/REJECTED as replacement — Devstral-Small-2-24B-2512 FP8, vLLM, 128K: faster, lower quality"
VRAM_MB=23000
HEALTH_TIMEOUT=1800
GPUS="0,1"
TENSOR_PARALLEL=2
GPU_UTIL=0.94
MAX_MODEL_LEN=131072
EXTRA_ARGS="--tokenizer-mode mistral --limit-mm-per-prompt '{"image":0}' --kv-cache-dtype fp8 --max-num-seqs 8 --max-num-batched-tokens 4096"
NOTES="TESTED 2026-08-09 and REJECTED as a replacement for 27b-fp8: faster on every speed axis, decisively worse on quality. Paired on this box with the same harness and thinking disabled on both: work_quality 73/100 vs 83/100, deep_reasoning 51/100 vs 70/100. Won only embedded_c_review (10/12 vs 8/12); lost code_repair 17/20 vs 20/20 — the executed coding task a coding model should own — plus bom 6/10 vs 10/10 and protocol_architecture 6/18 vs 10/18, and seven of eight reasoning tasks. SPEED (aggregate tok/s at 1/2/4/8): 57.0/113.9/221.5/419.1 vs the incumbent 46.6/85.8/161.3/295.1 — 21-42% faster, scales 7.35x vs 6.3x, per-stream decays only 8% vs 19%, TTFT at 8 concurrent 0.10s vs 0.64s, load 117s vs 282s. MEASURED SIZING confirms the pre-download arithmetic exactly: 11.79 GiB/card weights, 9.07 GiB/card KV, GPU KV cache size 237,728 tokens = 80.0 KiB/token against 80.0 predicted, 1.81x the 128K floor but below the incumbent tuned ~401K pool. fp8 KV WORKS on sm_86 for this arch. THREE TOOLCHAIN INCOMPATIBILITIES had to be worked around before it would run at all, none of them about the model: (1) tokenizer is_fast AttributeError, needs --tokenizer-mode mistral; (2) multimodal profiling ValueError, needs --limit-mm-per-prompt image 0; (3) the eval suites HTTP 400 on chat_template_kwargs, which now has a --no-template-kwargs opt-out. BENCH WARNING: llmctl bench reports ~24-33 tok/s and is WRONG for this model — it is terse and stops after ~11 tokens, so overhead dominates; forced-length generation measures 57.9 tok/s."
