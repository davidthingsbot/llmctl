NOTES="TESTED 2026-08-09 and REJECTED as a replacement for 27b-fp8: faster on every speed axis, decisively worse on quality. Paired on this box with the same harness and thinking disabled on both: work_quality 73/100 vs 83/100, deep_reasoning 51/100 vs 70/100. Won only embedded_c_review (10/12 vs 8/12); lost code_repair 17/20 vs 20/20 — the executed coding task a coding model should own — plus bom 6/10 vs 10/10 and protocol_architecture 6/18 vs 10/18, and seven of eight reasoning tasks. SPEED (aggregate tok/s at 1/2/4/8): 57.0/113.9/221.5/419.1 vs the incumbent 46.6/85.8/161.3/295.1 — 21-42% faster, scales 7.35x vs 6.3x, per-stream decays only 8% vs 19%, TTFT at 8 concurrent 0.10s vs 0.64s, load 117s vs 282s. MEASURED SIZING confirms the pre-download arithmetic exactly: 11.79 GiB/card weights, 9.07 GiB/card KV, GPU KV cache size 237,728 tokens = 80.0 KiB/token against 80.0 predicted, 1.81x the 128K floor but below the incumbent tuned ~401K pool. fp8 KV WORKS on sm_86 for this arch. THREE TOOLCHAIN INCOMPATIBILITIES had to be worked around before it would run at all, none of them about the model: (1) tokenizer is_fast AttributeError, needs --tokenizer-mode mistral; (2) multimodal profiling ValueError, needs --limit-mm-per-prompt image 0; (3) the eval suites HTTP 400 on chat_template_kwargs, which now has a --no-template-kwargs opt-out. BENCH WARNING: llmctl bench reports ~24-33 tok/s and is WRONG for this model — it is terse and stops after ~11 tokens, so overhead dominates; forced-length generation measures 57.9 tok/s."
