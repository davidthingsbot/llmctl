NOTES="DeepSeek-V4-Flash 284B total / 13B active, arch=deepseek4, 43 layers, 256 experts top-6 + 1 shared, 1M native context via YaRN 16x from a 65536 trained context (quality above ~64K unproven). REQUIRES llama.cpp >= b10265 — b8189 knows only deepseek/deepseek2 and refuses the file. Exact tensor accounting from the GGUF headers: IQ2_XXS experts 78.11GiB (1.816/layer) + non-expert 5.95 + embed 0.56 = 84.62GiB; IQ1_S experts 70.36GiB (1.636/layer) = 76.87GiB. Sizing: GPU = 6666MiB fixed + (43-N) x per-layer + KV + ~1050 compute. MEASURED 2026-08-04: IQ2_XXS moe26 split 0.74 gave 1x131072 at 8.2 tok/s, RAM 51G used/10G avail/3G swap and ~7% memory stall; IQ1_S moe26 same split gave 2x131072 at 5.5-7.4 tok/s, RAM 46G used/16G avail, ~0% pressure — IQ1_S SHIPPED because the second slot and the absence of memory pressure beat 15% speed. --no-mmap IS MANDATORY: the model exceeds RAM so with mmap the kernel evicts CPU-resident experts as page cache and re-reads them from disk every token, 1.48 vs 6.39 tok/s (4.3x). --tensor-split 0.5,0.5 fails hard (tried to allocate 35418MiB on a 24124MiB card) because --n-cpu-moe makes the first N layers light; 0.74,0.26 balances, re-bisect on any moe change. RAM not VRAM is the binding constraint, unusually for this box. HONEST FIT: 2 slots x 128K at ~7 tok/s does not serve hermes, which runs 2+ concurrent streams per profile — this is an ask-and-come-back model, not an agent backend."
