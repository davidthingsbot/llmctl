NOTES="MoE 122B total / 10B active: 48 layers, 256 experts (top-8), 56.09GiB at UD-IQ4_XS so it cannot fit 48GB VRAM. SHIPPED: -np 4 slots of 131072 each (SERVER_CTX 524288 total), --n-cpu-moe 20, --tensor-split 0.635,0.365, -ctk/-ctv q8_0, -fit off — 22182/22524MiB VRAM (1941/1602 free), KV 6528MiB. FOUR SLOTS BECAUSE hermes/mr-c is not one conversation: main gateway thread + bg-review + up to 3 concurrent children, and too few slots means streams evict each other at ~18.5min per full 127K re-prefill. q8_0 KV is what makes 4 slots affordable (6528MiB for 4x131072 vs 9216MiB for only 2x196608 at f16) and allows moe 20 instead of 22; it costs ~9% generation from dequantisation (11.8 vs 13.0 tok/s at equal moe 19). q8_0 QUALITY VALIDATED against f16 at a 120,564-token context with needles at 15/40/65/90% depth: 4/4 recalled on both, half the outputs byte-identical, every answer token correct where text differed. -fit off IS REQUIRED and is the most useful flag here: every 'failed to fit params ... abort' is llama_params_fit refusing to leave 1024MiB per device free, NOT a real capacity limit — at moe 19 both cards had positive headroom (573/1490MiB) and it still aborted. An earlier claim in this file that 256Kx2 was blocked by layer granularity was WRONG; it was the same safety target. Do not bisect splits to satisfy the fitter. CONFIG TRAP: SERVER_CTX is --ctx-size TOTAL (llama.cpp divides by -np) while CTX is what agents are told, so CTX must be PER-SLOT or hermes overflows. --tensor-split must never be 1,1 (an even split gave CUDA0 8856MiB vs CUDA1 28407MiB) and must be re-bisected on every --n-cpu-moe change. Prompt caching gives 512-2000 token evals on repeat turns, but anything rewriting history kills it — hermes 'Repaired N message-alternation violation(s)' caused a full 18.5min re-prefill. Tool calling verified via --jinja at -np 1/2/4."
