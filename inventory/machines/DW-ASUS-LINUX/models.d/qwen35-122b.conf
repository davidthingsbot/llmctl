NOTES="MoE 122B total / 10B active: 48 layers, 256 experts (top-8), 56.09GiB at UD-IQ4_XS so it cannot fit 48GB VRAM. SHIPPED: -np 2 slots of 196608 ctx each (SERVER_CTX 393216 total), --n-cpu-moe 22, --tensor-split 0.655,0.345 — 22950/22140MiB VRAM, KV 9216MiB, 224.6 tok/s prefill, 11.5 tok/s gen. TWO SLOTS MATTER: with -np 1 there is one KV cache and any two conversations evict each other — measured mr-c prefill 90161 tokens, a 1876-token browser chat landed, mr-c redid 90119 from scratch; hermes and mr-c thrash the same way. CRITICAL: SERVER_CTX is --ctx-size TOTAL and llama.cpp divides by -np, while CTX is what agents are told, so CTX must be the PER-SLOT value (196608) or hermes overflows the slot. Per-slot curve at -np 2: 128K=12.4 tok/s (free, same KV), 192K moe22=11.24, 240K moe24=10.05 — doubling KV for two slots pushes more experts to RAM. Full 256Kx2 is NOT reachable despite 3GB spare: at moe 25 only 23 heavy layers remain, each swinging ~2.4GB, so 0.67 starves CUDA1 and 0.685 starves CUDA0 — layer granularity, not capacity. --tensor-split is REQUIRED and must never be 1,1 (an even split gave CUDA0 8856MiB vs CUDA1 28407MiB, a 4.6GB overflow, while the total fit); --n-cpu-moe sets tensor_buft_overrides which disables llama_params_fit, so re-bisect the split on every --n-cpu-moe change — an analytic estimate was unreliable. Prompt caching (--cache-reuse 256) makes repeat agent turns 15-100s against a ~6min cold first turn; measure prefill with a multi-thousand-token prompt. Tool calling verified via --jinja, no parser plugin needed."
