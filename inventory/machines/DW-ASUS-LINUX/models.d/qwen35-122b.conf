NOTES="MoE 122B total / 10B active: 48 layers, 256 experts (top-8), 56.09GiB at UD-IQ4_XS so it cannot fit 48GB VRAM. SHIPPED: -np 4 slots of 131072 each (SERVER_CTX 524288 total), --n-cpu-moe 20, --tensor-split 0.635,0.365, -ctk/-ctv q8_0, -fit off — 22182/22524MiB VRAM (1941/1602 free), KV 6528MiB. FOUR SLOTS BECAUSE hermes/mr-c is not one conversation: main gateway thread + bg-review + up to 3 concurrent children, and too few slots means streams evict each other at ~18.5min per full 127K re-prefill. q8_0 KV is what makes 4 slots affordable (6528MiB for 4x131072 vs 9216MiB for only 2x196608 at f16) and allows moe 20 instead of 22; it costs ~9% generation from dequantisation (11.8 vs 13.0 tok/s at equal moe 19). q8_0 QUALITY VALIDATED against f16 at a 120,564-token context with needles at 15/40/65/90% depth: 4/4 recalled on both, half the outputs byte-identical, every answer token correct where text differed. -fit off IS REQUIRED and is the most useful flag here: every 'failed to fit params ... abort' is llama_params_fit refusing to leave 1024MiB per device free, NOT a real capacity limit — at moe 19 both cards had positive headroom (573/1490MiB) and it still aborted. An earlier claim in this file that 256Kx2 was blocked by layer granularity was WRONG; it was the same safety target. Do not bisect splits to satisfy the fitter. CONFIG TRAP: SERVER_CTX is --ctx-size TOTAL (llama.cpp divides by -np) while CTX is what agents are told, so CTX must be PER-SLOT or hermes overflows. --tensor-split must never be 1,1 (an even split gave CUDA0 8856MiB vs CUDA1 28407MiB) and must be re-bisected on every --n-cpu-moe change. Prompt caching gives 512-2000 token evals on repeat turns, but anything rewriting history kills it — hermes 'Repaired N message-alternation violation(s)' caused a full 18.5min re-prefill. Tool calling verified via --jinja at -np 1/2/4. THREADS: 6 is optimal, swept 2026-08-04 — 4=10.60, 6=13.58, 8=12.05, 12=13.38 tok/s gen (prefill flat ~276 across all, so prefill is GPU-bound and generation is the CPU-bound half). 8 being worse than both 6 and 12 is real, not noise: llama.cpp barrier-syncs expert work per layer so the slowest thread gates it, and 8 threads on 6 cores leaves two cores doubled as stragglers, while 12 doubles every core evenly. Do not re-tune blind. GPU1 RUNS AT ~6% AND CANNOT BE FIXED: measured GPU0 56.5% busy in 100% of samples vs GPU1 6.0% in 13.6% over 88 samples. --split-mode layer is a pipeline (GPUs never run together) and --n-cpu-moe offloads the FIRST 20 layers, all on GPU0 under the 0.635 split, so GPU0 owns every CPU round-trip while GPU1 holds ~17 resident layers it finishes instantly. --split-mode row does NOT fit (tried to allocate 24567MiB on a 24124MiB card; raising --n-cpu-moe to 24 did not shrink it). Rebalancing would not help regardless — the CPU is the bottleneck, so both cards waiting more evenly yields no extra tokens. Real limits are no AVX2/FMA and DDR3 bandwidth. BROKEN BY THE b10270 UPGRADE, RETUNED 2026-08-04: the previous --n-cpu-moe 20 --tensor-split 0.635,0.365 config NO LONGER LOADS on llama.cpp b10270 — it dies with 'graph_reserve: failed to allocate compute buffers / failed to allocate compute pp buffers' and systemd restart-loops (19 attempts before being stopped). b10270 needs more compute-buffer VRAM than b8189 for the same settings, and this config had been tuned to leave only ~1.2-1.9GiB free per card. Fix: raise --n-cpu-moe 20 -> 24 and re-bisect the split to 0.665,0.335, giving 2868/1256MiB free. CRITICALLY, THE UPGRADE BOUGHT THIS MODEL NOTHING: prefill 244.3 -> 251.9 tok/s and generation 12.7 -> 11.6-12.2 (slightly WORSE, because 4 more expert layers had to move to CPU). Contrast coder-next, which roughly doubled on the same upgrade — it is fully VRAM-resident and gained from upstream CUDA kernel work, whereas this model is bottlenecked on the CPU expert path (no AVX2, DDR3 bandwidth), which upstream did not touch. Expect the same pattern for any heavily CPU-offloaded model: engine upgrades help VRAM-resident models and not these. Split direction reminder: GPU0 having MORE free memory means RAISE the split (put more layers on GPU0), not lower — got this backwards once here."
