NOTES="Qwen3.6-35B-A3B at UD-Q6_K_XL (31.8GB), higher-precision alternative to the built-in 35b-moe-gguf (UD-Q4_K_XL, 22.4GB). Measured 2026-08-04 on llama.cpp b10270 with q8_0 KV and -fit off: Q4_K_XL 4x262144 = 138.1 tok/s; Q6_K_XL 4x262144 = 132.0 tok/s with 4149 prefill; Q8_K_XL only reached 4x131072 at 77.8 tok/s / 2674 prefill — half the speed AND half the context, so Q8 is not worth using on this hardware. No CPU offload needed: 31.8GB of weights fits 48GB VRAM outright. Throughput figures are pessimistic; a 40GB download was competing for disk and CPU during the sweep. TUNED 2026-08-04 to 4x196608 split 0.5,0.5 — free 1488/2852MiB, 129.0 tok/s. The earlier 4x262144 sweep config was NOT shippable (124MiB free on CUDA0) and NO SPLIT COULD FIX IT: total free across both cards was only 1612MiB, so lowering the split just moved ~2.5GB onto CUDA1 which had 1488 — three bisection attempts all died with 'failed to allocate compute pp buffers'. Dropping context to 192K freed enough KV that the default 0.5 split balanced on the first try. RULE: check TOTAL free VRAM across both cards first; under ~2GB total, no split can leave a safe margin and context must come down instead. Cost of the drop is small — 132.0 -> 129.0 tok/s — but note the Q4_K_XL build still reaches the full 4x262144 at 138.1, so Q4 remains the better choice when context matters more than precision."
