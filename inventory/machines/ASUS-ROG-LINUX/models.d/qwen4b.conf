NOTES="Hand-written 2026-09-22. This laptop's RTX 3070 Ti has 8 GiB and whisper large-v3-turbo (uv-run server on :8765, NOT an llmctl service) permanently holds ~2.2 GiB of it, so the model budget is ~5.5 GiB. Q6_K (3.28 GiB) was chosen over Q8_0 (4.17 GiB) so that 64K of total context and compute buffers fit with margin; the 9B Q4_K_M the other boxes run (~5.9 GiB) does not fit beside whisper at all. KV estimate from config.json: Qwen3.5-4B is hybrid, 8 of 32 layers are full attention (4 KV heads x 256 head_dim), so q8_0 KV is ~17 KiB/token, ~1.1 GiB at 64K. Thinking is off by default via --chat-template-kwargs for the same reason dw-bee's qwen9b.conf records (degenerate loops on trivial prompts); callers opt in per request with chat_template_kwargs enable_thinking true. Vision projector mmproj-Qwen3.5-4B-F16.gguf (0.63 GiB) is downloaded next to the weights but NOT loaded here: with its buffers it would push the total past the whisper-constrained budget unless context drops to ~32K total. The llama-server is the prebuilt ggml-org release b11115 ubuntu-cuda-12.8 tarball plus its cudart tarball under ~/llama.cpp-bin/b11115 (no root on this box, no CUDA toolkit installed; the /usr/local/bin/llama-server is a CPU-only b5891). MEASURED 2026-09-22 at first start, whisper resident: load 4s; llama-server process 5074 MiB, whisper 2252 MiB, 495 MiB free of 8192 — so there is NO headroom for the vision projector at this context, and a whisper transcription burst is the thing most likely to OOM one or the other. Prefill 1039 tok/s on the 1544-token start-bench, 339 tok/s on a 27-token prompt; generation 24.0 tok/s on a 248-token reply. THAT GENERATION FIGURE IS A BATTERY ARTEFACT, NOT THE MODEL: the laptop was on battery (AC0 online=0, BAT0 discharging) and nvidia-smi showed the SM clock pinned at 300-330 MHz against a 1635 MHz maximum, 55 W against a 120 W limit, throttle reasons 0x24 (SW power cap + SW thermal slowdown), at 97-98 percent utilisation. The identical Q6-class