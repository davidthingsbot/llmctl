MACHINE_NAME="dw-lenovo-linux"
NOTES="Lenovo laptop, Intel Core Ultra 7 155U (Meteor Lake: 2P+8E+2LPE = 12 cores / 14 threads, AVX2 + AVX-VNNI, no AVX-512), 15 GiB RAM, Intel Arc iGPU with no CUDA/ROCm, so ACCEL=cpu and VRAM_PER_GPU_MB=0. No docker, no uv on PATH at first, and no passwordless sudo, so everything is user-local: uv 0.12 lives in ~/.venvs/uv (symlinked to ~/.local/bin/uv), and ffmpeg is the 7.0.2 static binary shipped in the imageio-ffmpeg PyPI wheel, symlinked to ~/.local/bin/ffmpeg because whisper-server with --convert exits at startup when ffmpeg is not on PATH (systemd --user PATH here does include ~/.local/bin). No LLM backend is installed: VLLM_BIN and LLAMA_SERVER are unedited defaults and no model is registered. The box is a speech companion: whisper.cpp v1.9.5 (d1be6fd, 2026-10-06) built the same day, CPU only, Release + GGML_NATIVE + OpenMP, at /home/david/work/whisper.cpp/build-cpu (keep the build dir name: build-tree binaries carry a RUNPATH into their own bin/), and Kokoro-FastAPI natively from /home/david/work/Kokoro-FastAPI (see services.d/). Services bind 127.0.0.1 on purpose: this is a roaming laptop and both servers are unauthenticated, so unlike the desktops they are not exposed on the LAN; set HOST=0.0.0.0 in services.d/*.conf to share them."
ACCEL=cpu
GPUS_DEFAULT=""
TENSOR_PARALLEL_DEFAULT=1
VRAM_PER_GPU_MB=0
VLLM_BIN="/home/david/.venvs/vllm/bin/vllm"
LLAMA_SERVER="/home/david/work/llama.cpp/build/bin/llama-server"
MODELS_DIR="/home/david/models"
WIZARD_BASE_PORT=19438
ENABLE_BUILTIN_MODELS=0
HERMES_ENABLE=0
OPENCLAW_ENABLE=0
WHISPER_SERVER="/home/david/work/whisper.cpp/build-vk/bin/whisper-server"
WEBUI_ENABLE=0
WEBUI_CONTAINER="open-webui"
WEBUI_PORT=8088
WEBUI_IMAGE="ghcr.io/open-webui/open-webui:main"
LEGACY_UNITS="qwen-dual3090-27b-q8-llamacpp.service qwen-dual3090-35b-moe-llamacpp.service qwen-dual3090-27b-fp8-vllm.service qwen-dual3090-35b-moe-vllm.service local-agent-qwen.service"
