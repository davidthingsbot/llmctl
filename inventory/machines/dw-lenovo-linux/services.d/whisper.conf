DESC="whisper large-v3-turbo q5_0, whisper.cpp Vulkan on the Meteor Lake Intel iGPU"
NOTES="whisper.cpp v1.9.5 (d1be6fd, 2026-10-06) built the same day at /home/david/work/whisper.cpp/build-vk: Release + GGML_VULKAN + GGML_NATIVE + OpenMP, gcc 13.3, linked against the system libvulkan.so.1 (Mesa 25.2.8 ANV driver, device 'Intel(R) Graphics (MTL)', uma=1, fp16=1, no matrix cores). No libvulkan-dev, glslc or spirv headers in apt-land and no passwordless sudo, so the build uses the LunarG Vulkan SDK 1.4.363.0 unpacked user-locally at /home/david/work/.local-deps/vulkan-sdk-dl/1.4.363.0/x86_64 — build-time only (-DCMAKE_PREFIX_PATH, -DVulkan_INCLUDE_DIR, -DVulkan_GLSLC_EXECUTABLE), with -DVulkan_LIBRARY=/usr/lib/x86_64-linux-gnu/libvulkan.so.1 so the binaries have no runtime dependency on the SDK. A CPU-only sibling build sits at build-cpu for comparison. MEASURED 2026-10-06 on battery (powersave governor) with the 11 s jfk.wav: CPU build, 8 threads: large-v3-turbo encode 21.1 s / total 22.4 s, small-q5_1 3.1 / 4.5 s, base-q5_1 0.79 / 1.36 s; Vulkan build, warm: large-v3-turbo encode 3.6 s / total 5.3 s, small 1.4 s encode, base 0.33 s encode. whisper-bench turbo on Vulkan: encoder 3.54 s per 30 s window (CPU: 21.4 s), but per-token decode is SLOWER on the iGPU (28.5 ms vs 9.0 ms on CPU) — fine for short utterances, which is what this box transcribes. -fa made no difference on Vulkan. Mel + decode + overhead is ~1.7 s on top of the encode. The first Vulkan run after a reboot pays ~1.3 s extra for shader compilation (Mesa caches it). ACCESS TRAP: david is NOT in the render group; /dev/dri/renderD128 is reachable now only through logind's per-session ACL, so when this unit starts at boot via linger before anyone logs in, ANV cannot open the device and ggml-vulkan would fall back to llvmpipe (software Vulkan, far slower than the CPU build). Fix once with 'sudo usermod -aG render david' and re-login. THREADS=4: with the encoder on the GPU the CPU threads only run mel + the decoder, and 4 was as fast as 8 here. NO AUTHENTICATION and a roaming laptop, so HOST=127.0.0.1 — unlike the desktops, not on the LAN. --convert is on: ffmpeg is the static 7.0.2 binary from the imageio-ffmpeg wheel symlinked to ~/.local/bin/ffmpeg, which the systemd --user PATH includes. LANGUAGE: -l en, not the -l auto the desktops use — MEASURED via the service on the 11 s jfk.wav: lang=auto 7.9-8.1 s, language=en 4.4 s, because auto-detection is an extra decoder pass and the decoder is the slow half on this iGPU (3.6 s per request, ~45%). A client that needs detection posts language=auto (the form field overrides the server default per request)."
HEALTH_PATH=/v1/health
HEALTH_TIMEOUT=120
EXTRA_ARGS="-l en --request-path /v1 --inference-path /audio/transcriptions"
